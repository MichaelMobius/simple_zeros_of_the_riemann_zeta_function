name: Lean v17 scalar core

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - "lean_harness/v17_scalar/**"
      - ".github/workflows/lean-v17-scalar.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout exact Zeta23 upstream
        uses: actions/checkout@v4
        with:
          repository: anthropics/formal-math
          ref: fbdc36bbf17d20af3fd0447c6d1a8a02773c9844
          path: upstream

      - name: Install scalar module
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p upstream/zeta23/HurtadoZeta23
          cp harness/lean_harness/v17_scalar/V17StrongBlockScalar.lean \
             upstream/zeta23/HurtadoZeta23/V17StrongBlockScalar.lean
          cat >> upstream/zeta23/lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23V17Scalar"
          roots = ["HurtadoZeta23.V17StrongBlockScalar"]
          EOF

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd upstream/zeta23
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Fetch mathlib cache
        working-directory: upstream/zeta23
        shell: bash
        run: lake exe cache get

      - name: Build scalar core
        working-directory: upstream/zeta23
        shell: bash
        run: lake build HurtadoZeta23V17Scalar
