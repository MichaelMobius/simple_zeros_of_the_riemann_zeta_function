name: v26 package E3 R1 Nat-code dispatch pilot

on:
  push:
    branches: [v26-package-e-staging]
    paths:
      - 'certification/v26_exact/generate_v26_r1_code_dispatch.py'
      - '.github/workflows/v26-package-e3-r1-code-dispatch-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r1-code-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Checkout pinned formal-math/zeta23 base
        run: |
          git clone https://github.com/anthropics/formal-math.git /tmp/formal-math
          cd /tmp/formal-math
          git checkout fbdc36bbf17d20af3fd0447c6d1a8a02773c9844
      - name: Reconstruct HurtadoZeta23 source overlay
        run: |
          cd /tmp/formal-math/zeta23
          mkdir -p HurtadoZeta23
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/hurtado-analytic.tar.gz
          tar -xzf /tmp/hurtado-analytic.tar.gz -C .
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado-adj.tar.gz
          tar -xzf /tmp/hurtado-adj.tar.gz -C .
          find "$GITHUB_WORKSPACE"/lean_harness -name '*.lean' -not -path '*/v20_analytic/*' -not -path '*/v21_analytic/*' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "HurtadoZeta23/$(basename "$f")"
          done
          cp "$GITHUB_WORKSPACE"/lean_harness/v20_analytic/*.lean HurtadoZeta23/
          cp "$GITHUB_WORKSPACE"/lean_harness/v21_analytic/*.lean HurtadoZeta23/
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23"
          roots = ["HurtadoZeta23"]
          EOF
      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/formal-math/zeta23/.lake/build
          key: v26-package-e3-r1-code-dispatch-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            v26-package-e3-r1-survivor-${{ runner.os }}-
            v26-package-e3-r1-discards-${{ runner.os }}-
            v26-package-e3-code-dispatch-${{ runner.os }}-
            v26-package-e3-r1-catalog-${{ runner.os }}-
            v26-package-e3-zeta23-${{ runner.os }}-
            v26-package-e-zeta23-${{ runner.os }}-
      - name: Generate R1 Nat-code dispatch inputs
        run: |
          OUT=/tmp/formal-math/zeta23/HurtadoZeta23
          python certification/v26_exact/generate_v26_bootstrap_lean.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r0_cell_catalog.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r0_survivor_contractions.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r0_code_dispatch.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r1_cell_catalog.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r1_analytic_discards.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r1_survivor_contractions.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r1_code_dispatch.py --out-dir "$OUT"
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('/tmp/formal-math/zeta23/HurtadoZeta23/v26_r1_code_dispatch_manifest.json').read_text())
          assert m['round1_codes'] == 231
          assert m['discard_codes'] == 208
          assert m['survivor_codes'] == 23
          assert m['discard_chunks'] == 21
          assert m['survivor_chunks'] == 3
          print('R1 dispatch manifest counts OK')
          PY
          if grep -R -n -E '\b(sorry|admit|axiom|opaque|unsafe|native_decide)\b' \
              "$OUT"/V26R1CodeDispatch*Generated.lean; then
            echo 'Forbidden proof shortcut found in R1 Nat-code dispatch'
            exit 1
          fi
      - name: Fetch mathlib cache
        run: |
          cd /tmp/formal-math/zeta23
          lake exe cache get
      - name: Kernel-check R1 dispatch base
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26R1CodeDispatchBaseGenerated
      - name: Kernel-check first R1 survivor dispatch chunk
        run: |
          cd /tmp/formal-math/zeta23
          set +e
          lake build HurtadoZeta23.V26R1CodeDispatchSurvivor00Generated > "$GITHUB_WORKSPACE/r1-dispatch-survivor00.log" 2>&1
          status=$?
          grep -n -E 'error:|unsolved goals|type mismatch|application type mismatch|failed to synthesize|unknown identifier|maximum heartbeats|maximum recursion' "$GITHUB_WORKSPACE/r1-dispatch-survivor00.log" | tail -n 80 || true
          tail -n 140 "$GITHUB_WORKSPACE/r1-dispatch-survivor00.log"
          exit "$status"
      - name: Kernel-check first R1 discard dispatch chunk
        if: success()
        run: |
          cd /tmp/formal-math/zeta23
          set +e
          lake build HurtadoZeta23.V26R1CodeDispatchDiscard00Generated > "$GITHUB_WORKSPACE/r1-dispatch-discard00.log" 2>&1
          status=$?
          grep -n -E 'error:|unsolved goals|type mismatch|application type mismatch|failed to synthesize|unknown identifier|maximum heartbeats|maximum recursion' "$GITHUB_WORKSPACE/r1-dispatch-discard00.log" | tail -n 80 || true
          tail -n 140 "$GITHUB_WORKSPACE/r1-dispatch-discard00.log"
          exit "$status"
      - name: Upload R1 dispatch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-code-dispatch-diagnostics
          path: |
            r1-dispatch-survivor00.log
            r1-dispatch-discard00.log
          if-no-files-found: warn
      - name: Save Lean build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/formal-math/zeta23/.lake/build
          key: v26-package-e3-r1-code-dispatch-${{ runner.os }}-${{ github.sha }}
