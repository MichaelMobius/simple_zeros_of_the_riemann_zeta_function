name: v20 analytic kernel certificate

on:
  push:
    branches: [v20-analytic-kernel-cert]
  pull_request:
    paths:
      - 'lean_harness/v20_analytic/**'
      - '.github/workflows/v20-analytic-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytic-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned formal-math/zeta23 base
        run: |
          git clone https://github.com/anthropics/formal-math.git /tmp/formal-math
          cd /tmp/formal-math
          git checkout fbdc36bbf17d20af3fd0447c6d1a8a02773c9844

      - name: Reconstruct HurtadoZeta23 source overlay
        run: |
          cd /tmp/formal-math/zeta23
          mkdir -p HurtadoZeta23
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/hurtado-analytic.tar.gz
          tar -xzf /tmp/hurtado-analytic.tar.gz -C .
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado-adj.tar.gz
          tar -xzf /tmp/hurtado-adj.tar.gz -C .
          find "$GITHUB_WORKSPACE"/lean_harness -name '*.lean' -not -path '*/v20_analytic/*' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "HurtadoZeta23/$(basename "$f")"
          done
          cp "$GITHUB_WORKSPACE"/lean_harness/v20_analytic/*.lean HurtadoZeta23/
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23"
          roots = ["HurtadoZeta23"]
          EOF

      - name: Locate inherited native_decide and trial kernel-reducible replacement
        run: |
          cd /tmp/formal-math/zeta23
          mapfile -t matches < <(grep -R -l 'v17_pairMultiplicitySumNat_450' HurtadoZeta23 || true)
          if [ "${#matches[@]}" -ne 1 ]; then
            printf 'Expected exactly one source file, found %s\n' "${#matches[@]}" >&2
            printf '%s\n' "${matches[@]}" >&2
            exit 1
          fi
          target="${matches[0]}"
          printf '%s\n' "$target" | tee /tmp/v20-native-decide-file.txt
          cp "$target" /tmp/v20-native-decide-original.lean
          grep -n -B 25 -A 25 'v17_pairMultiplicitySumNat_450' "$target" \
            | tee /tmp/v20-native-decide-context.txt
          python3 - "$target" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          marker = 'theorem v17_pairMultiplicitySumNat_450'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('target theorem marker not found')
          next_decl_candidates = [
              p for token in ('\ntheorem ', '\nlemma ', '\ndef ', '\nnoncomputable def ')
              if (p := text.find(token, start + len(marker))) >= 0
          ]
          end = min(next_decl_candidates) if next_decl_candidates else len(text)
          block = text[start:end]
          count = block.count('native_decide')
          if count != 1:
              raise SystemExit(f'expected exactly one native_decide in theorem block, found {count}')
          text = text[:start] + block.replace('native_decide', 'decide', 1) + text[end:]
          path.write_text(text)
          PY
          cp "$target" /tmp/v20-native-decide-patched.lean
          grep -n -B 25 -A 25 'v17_pairMultiplicitySumNat_450' "$target" \
            | tee /tmp/v20-native-decide-patched-context.txt

      - name: Upload native_decide diagnostic sources
        uses: actions/upload-artifact@v4
        with:
          name: v20-native-decide-diagnostic
          path: |
            /tmp/v20-native-decide-file.txt
            /tmp/v20-native-decide-context.txt
            /tmp/v20-native-decide-patched-context.txt
            /tmp/v20-native-decide-original.lean
            /tmp/v20-native-decide-patched.lean
          if-no-files-found: error

      - name: Fetch mathlib cache
        run: |
          cd /tmp/formal-math/zeta23
          lake exe cache get

      - name: Build analytic kernel theorem
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V20KernelSignedAnalytic

      - name: Build final v20 assembly
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V20FinalAssembly

      - name: Print transitive theorem axioms
        run: |
          cd /tmp/formal-math/zeta23
          cat > /tmp/V20AxiomAudit.lean <<'EOF'
          import HurtadoZeta23.V20FinalAssembly
          #print axioms HurtadoZeta23.v20_kernel_signed_89_100
          #print axioms HurtadoZeta23.v20_kernel_signed_claim
          #print axioms HurtadoZeta23.v20_published_eps_form
          EOF
          lake env lean /tmp/V20AxiomAudit.lean | tee /tmp/v20-axioms.txt
          ! grep -n 'sorryAx' /tmp/v20-axioms.txt
          ! grep -n '_native\.native_decide\.ax_' /tmp/v20-axioms.txt

      - name: Reject Lean placeholders
        run: |
          ! find "$GITHUB_WORKSPACE/lean_harness/v20_analytic" -name '*.lean' -print0 \
            | xargs -0 grep -nE '\bsorry\b|\badmit\b'

      - name: Reject new trusted or unsafe declarations
        run: |
          ! find "$GITHUB_WORKSPACE/lean_harness/v20_analytic" -name '*.lean' -print0 \
            | xargs -0 grep -nE '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]'

      - name: Guard analytic dependency direction
        run: |
          ! grep -nE 'V17KernelSignedCertPointClaim|ArchivedSevenPointClaim|V17FinalAssembly|ExternalCertificateFrontier' \
            "$GITHUB_WORKSPACE/lean_harness/v20_analytic/V20KernelSignedAnalytic.lean"
