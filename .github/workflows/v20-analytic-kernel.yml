name: v20 analytic kernel certificate

on:
  push:
    branches: [v20-analytic-kernel-cert]
  pull_request:
    paths:
      - 'lean_harness/v20_analytic/**'
      - '.github/workflows/v20-analytic-kernel.yml'
  workflow_dispatch:

jobs:
  analytic-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact-kernel proof fixes under test
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('lean_harness/v20_analytic/V20KernelSignedAnalytic.lean')
          s = p.read_text()

          replacements = [
          ('''    _ = ((∫ t in (-(1 : ℝ) / 2)..(1 / 2), Real.cos ((a - b) * t)) +
          (∫ t in (-(1 : ℝ) / 2)..(1 / 2), Real.cos ((a + b) * t))) / 2 := by
      rw [intervalIntegral.integral_div, intervalIntegral.integral_add] <;> fun_prop
''', '''    _ = ((∫ t in (-(1 : ℝ) / 2)..(1 / 2), Real.cos ((a - b) * t)) +
          (∫ t in (-(1 : ℝ) / 2)..(1 / 2), Real.cos ((a + b) * t))) / 2 := by
      rw [intervalIntegral.integral_div]
      rw [intervalIntegral.integral_add]
      · exact (by fun_prop : Continuous (fun t : ℝ => Real.cos ((a - b) * t))).intervalIntegrable _ _
      · exact (by fun_prop : Continuous (fun t : ℝ => Real.cos ((a + b) * t))).intervalIntegrable _ _
'''),
          ('''        unfold v20B
        ring
      _ = _ := hprod
''', '''        unfold v20B
        ring_nf
      _ = _ := hprod
'''),
          ('''  have hApB : v20A + v20B ≠ 0 := by
    positivity
''', '''  have hApB : v20A + v20B ≠ 0 := by
    exact ne_of_gt (add_pos v20_A_pos hBpos)
'''),
          ('''  field_simp [hAmB, hApB, hdenpos.ne']
  ring

private lemma v20_limitingK_zero_sinc :
    limitingK 0 = Real.sin v20A / v20A := by
  rw [limitingK_zero_closed]
  unfold v20A
  rw [div_inv]
  ring
''', '''  field_simp [hAmB, hApB, hdenpos.ne']
  ring_nf

private lemma v20_limitingK_zero_sinc :
    limitingK 0 = Real.sin v20A / v20A := by
  rw [limitingK_zero_closed]
  rw [show (Real.sqrt 2)⁻¹ = v20A by rfl]
  apply (eq_div_iff v20_A_pos.ne').2
  have hs2A : Real.sqrt 2 * v20A = 1 := by
    unfold v20A
    exact mul_inv_cancel₀ (by positivity)
  calc
    Real.sqrt 2 * Real.sin v20A * v20A =
        (Real.sqrt 2 * v20A) * Real.sin v20A := by ring
    _ = Real.sin v20A := by rw [hs2A, one_mul]
'''),
          ('''      v20A * Real.sin v20A = v20A ^ 2 * (Real.sin v20A / v20A) := by
        field_simp [v20_A_pos.ne']
        ring
''', '''      v20A * Real.sin v20A = v20A ^ 2 * (Real.sin v20A / v20A) := by
        field_simp [v20_A_pos.ne']
''')
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('expected source fragment not found')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned formal-math/zeta23 base
        run: |
          git clone https://github.com/anthropics/formal-math.git /tmp/formal-math
          cd /tmp/formal-math
          git checkout fbdc36bbf17d20af3fd0447c6d1a8a02773c9844

      - name: Reconstruct HurtadoZeta23 source overlay
        run: |
          cd /tmp/formal-math/zeta23
          mkdir -p HurtadoZeta23
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/hurtado-analytic.tar.gz
          tar -xzf /tmp/hurtado-analytic.tar.gz -C .
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado-adj.tar.gz
          tar -xzf /tmp/hurtado-adj.tar.gz -C .
          find "$GITHUB_WORKSPACE"/lean_harness -name '*.lean' -not -path '*/v20_analytic/*' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "HurtadoZeta23/$(basename "$f")"
          done
          cp "$GITHUB_WORKSPACE"/lean_harness/v20_analytic/V20KernelSignedAnalytic.lean HurtadoZeta23/
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23"
          roots = ["HurtadoZeta23"]
          EOF

      - name: Fetch mathlib cache
        run: |
          cd /tmp/formal-math/zeta23
          lake exe cache get

      - name: Build analytic certificate
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V20KernelSignedAnalytic

      - name: Reject placeholders
        run: |
          ! grep -nE '\bsorry\b|\badmit\b' "$GITHUB_WORKSPACE"/lean_harness/v20_analytic/V20KernelSignedAnalytic.lean
