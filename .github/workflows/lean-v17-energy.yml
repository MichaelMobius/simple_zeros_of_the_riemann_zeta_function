name: Lean v17 450-point energy bridge

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - "lean_harness/v17_energy/**"
      - "lean_src/**"
      - "lean_harness/frozen/FiniteGridEndpointBridge.lean"
      - "lean_harness/frozen/DiscreteCentralityBridge.lean"
      - "lean_harness/frozen/FourierL1.lean"
      - ".github/workflows/lean-v17-energy.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout exact Zeta23 upstream
        uses: actions/checkout@v4
        with:
          repository: anthropics/formal-math
          ref: fbdc36bbf17d20af3fd0447c6d1a8a02773c9844
          path: upstream

      - name: Overlay lightweight v17 energy sources
        shell: bash
        run: |
          set -euxo pipefail
          cat harness/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C upstream/zeta23

          cat harness/lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/hurtado-analytic.tar.gz
          tar -xzf /tmp/hurtado-analytic.tar.gz -C upstream/zeta23

          cp harness/lean_harness/frozen/DiscreteCentralityBridge.lean upstream/zeta23/HurtadoZeta23/DiscreteCentralityBridge.lean
          cp harness/lean_harness/frozen/FiniteGridEndpointBridge.lean upstream/zeta23/HurtadoZeta23/FiniteGridEndpointBridge.lean
          cp harness/lean_harness/frozen/FourierL1.lean upstream/zeta23/HurtadoZeta23/FourierL1.lean

          cp harness/lean_harness/v17_energy/V17KernelBridge450.lean upstream/zeta23/HurtadoZeta23/V17KernelBridge450.lean
          cp harness/lean_harness/v17_energy/V17PairBandReindexCore.lean upstream/zeta23/HurtadoZeta23/V17PairBandReindexCore.lean
          cp harness/lean_harness/v17_energy/V17MatrixEnergy450.lean upstream/zeta23/HurtadoZeta23/V17MatrixEnergy450.lean
          cp harness/lean_harness/v17_energy/V17ArticleSynthesisOverlapCore.lean upstream/zeta23/HurtadoZeta23/V17ArticleSynthesisOverlapCore.lean
          cp harness/lean_harness/v17_energy/V17PoissonGramBound.lean upstream/zeta23/HurtadoZeta23/V17PoissonGramBound.lean
          cp harness/lean_harness/v17_energy/V17CompactOverlapCore.lean upstream/zeta23/HurtadoZeta23/V17CompactOverlapCore.lean
          cp harness/lean_harness/v17_energy/V17AnalyticBridge450.lean upstream/zeta23/HurtadoZeta23/V17AnalyticBridge450.lean
          cp harness/lean_harness/v17_energy/V17GramEnergy450.lean upstream/zeta23/HurtadoZeta23/V17GramEnergy450.lean

      - name: Register exact Hurtado import closure
        working-directory: upstream/zeta23
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          todo = ["HurtadoZeta23.V17GramEnergy450"]
          seen = set()
          missing = []
          while todo:
              mod = todo.pop()
              if mod in seen:
                  continue
              seen.add(mod)
              path = Path(mod.replace('.', '/') + '.lean')
              if not path.exists():
                  missing.append((mod, '<root>'))
                  continue
              for line in path.read_text(encoding='utf-8').splitlines():
                  line = line.strip()
                  if not line.startswith('import '):
                      continue
                  for dep in line[len('import '):].split():
                      if dep.startswith('HurtadoZeta23.'):
                          dpath = Path(dep.replace('.', '/') + '.lean')
                          if dpath.exists():
                              todo.append(dep)
                          else:
                              missing.append((dep, mod))
          if missing:
              print('Missing Hurtado imports:')
              for dep, parent in missing:
                  print(f'  {parent} -> {dep}')
              raise SystemExit(1)
          roots = sorted(seen)
          print(f'Registering {len(roots)} modules in exact import closure')
          with open('lakefile.toml', 'a', encoding='utf-8') as f:
              f.write('\n[[lean_lib]]\n')
              f.write('name = "HurtadoZeta23V17Energy"\n')
              f.write('roots = [\n')
              for i, mod in enumerate(roots):
                  comma = ',' if i + 1 < len(roots) else ''
                  f.write(f'  "{mod}"{comma}\n')
              f.write(']\n')
          PY

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd upstream/zeta23
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Fetch mathlib cache
        working-directory: upstream/zeta23
        shell: bash
        run: lake exe cache get

      - name: Build 450-point energy bridge
        working-directory: upstream/zeta23
        shell: bash
        run: lake build HurtadoZeta23V17Energy
