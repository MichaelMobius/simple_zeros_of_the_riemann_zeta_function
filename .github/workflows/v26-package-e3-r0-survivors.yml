name: v26 package E3 R0 survivors

on:
  push:
    branches: [v26-package-e-staging]
    paths:
      - 'certification/v26_exact/generate_v26_r0_survivor_contractions.py'
      - 'certification/v26_exact/generate_v26_r0_cell_catalog.py'
      - 'certification/v26_exact/generate_v26_bootstrap_lean.py'
      - 'certification/v26_exact/v21_rational_bootstrap_verify.py'
      - 'lean_harness/v21_analytic/V26QuadraticCore.lean'
      - 'lean_harness/v21_analytic/V26QuadraticSix.lean'
      - 'lean_harness/v21_analytic/V26GapBlockLower.lean'
      - 'lean_harness/v21_analytic/V26BasinInterface.lean'
      - 'lean_harness/v21_analytic/V26OneBodyCellTools.lean'
      - '.github/workflows/v26-package-e3-r0-survivors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r0-survivors:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned formal-math/zeta23 base
        run: |
          git clone https://github.com/anthropics/formal-math.git /tmp/formal-math
          cd /tmp/formal-math
          git checkout fbdc36bbf17d20af3fd0447c6d1a8a02773c9844

      - name: Reconstruct HurtadoZeta23 source overlay
        run: |
          cd /tmp/formal-math/zeta23
          mkdir -p HurtadoZeta23
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/hurtado-analytic.tar.gz
          tar -xzf /tmp/hurtado-analytic.tar.gz -C .
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado-adj.tar.gz
          tar -xzf /tmp/hurtado-adj.tar.gz -C .
          find "$GITHUB_WORKSPACE"/lean_harness -name '*.lean' -not -path '*/v20_analytic/*' -not -path '*/v21_analytic/*' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "HurtadoZeta23/$(basename "$f")"
          done
          cp "$GITHUB_WORKSPACE"/lean_harness/v20_analytic/*.lean HurtadoZeta23/
          cp "$GITHUB_WORKSPACE"/lean_harness/v21_analytic/*.lean HurtadoZeta23/
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23"
          roots = ["HurtadoZeta23"]
          EOF

      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/formal-math/zeta23/.lake/build
          key: v26-package-e3-r0-survivors-${{ matrix.shard }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            v26-package-e3-r0-survivor-sample-${{ runner.os }}-
            v26-package-e3-survivor-${{ runner.os }}-
            v26-package-e3-zeta23-${{ runner.os }}-
            v26-package-e-zeta23-${{ runner.os }}-
            v26-package-d-zeta23-${{ runner.os }}-

      - name: Generate exact R0 survivor contractions
        run: |
          python certification/v26_exact/generate_v26_r0_cell_catalog.py \
            --out-dir /tmp/formal-math/zeta23/HurtadoZeta23
          python certification/v26_exact/generate_v26_r0_survivor_contractions.py \
            --out-dir /tmp/formal-math/zeta23/HurtadoZeta23
          if grep -R -n -E '\b(sorry|admit|axiom|opaque|unsafe|native_decide)\b' \
              /tmp/formal-math/zeta23/HurtadoZeta23/V26R0Survivor*Generated.lean; then
            echo 'Forbidden proof shortcut found in generated R0 survivor certificates'
            exit 1
          fi

      - name: Fetch mathlib cache
        run: |
          cd /tmp/formal-math/zeta23
          lake exe cache get

      - name: Kernel-check survivor shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cd /tmp/formal-math/zeta23
          TARGETS=$(python - <<'PY'
          import json, os
          shard=int(os.environ['SHARD'])
          count=8
          p='HurtadoZeta23/v26_r0_survivor_contractions_manifest.json'
          m=json.load(open(p))
          mods=[mod for i,mod in enumerate(m['modules']) if i % count == shard]
          assert len(m['modules']) == 231
          assert len(mods) in (28,29)
          print(' '.join('HurtadoZeta23.'+mod for mod in mods))
          PY
          )
          echo "shard $SHARD target count: $(wc -w <<<\"$TARGETS\")"
          lake build $TARGETS

      - name: Save Lean build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/formal-math/zeta23/.lake/build
          key: v26-package-e3-r0-survivors-${{ matrix.shard }}-${{ runner.os }}-${{ github.sha }}
