name: paper v26 PDF

on:
  push:
    branches: [v26-package-e-staging]
    paths:
      - 'paper/main.tex'
      - '.github/workflows/paper-v26-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Build PDF
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex

      - name: Validate final LaTeX log
        run: |
          cd paper
          if grep -q 'Overfull \\hbox' main.log; then
            echo 'ERROR: overfull hbox detected in final PDF build'
            grep 'Overfull \\hbox' main.log
            exit 1
          fi
          if grep -Eq 'There were undefined references|Citation .* undefined|Reference .* undefined' main.log; then
            echo 'ERROR: unresolved citation or cross-reference in final PDF build'
            grep -E 'There were undefined references|Citation .* undefined|Reference .* undefined' main.log || true
            exit 1
          fi
          echo 'Final LaTeX log validation OK'

      - name: Upload built PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-v26-pdf
          path: paper/main.pdf
          if-no-files-found: error

      - name: Commit regenerated PDF
        run: |
          git fetch origin v26-package-e-staging
          remote_head="$(git rev-parse origin/v26-package-e-staging)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Branch advanced to $remote_head while this run was building."
            echo "Skipping PDF commit; the newer workflow run will publish the current PDF."
            exit 0
          fi
          if git diff --quiet -- paper/main.pdf; then
            echo "paper/main.pdf is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.pdf
          git commit -m "build(paper): regenerate v26 PDF"
          git push origin HEAD:v26-package-e-staging
