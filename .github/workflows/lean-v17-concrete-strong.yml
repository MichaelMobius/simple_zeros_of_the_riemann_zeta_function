name: Lean v17 concrete strong block 450

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - "lean_harness/v17_concrete/**"
      - "lean_harness/v17_global/**"
      - "lean_harness/v17_endgame/**"
      - "lean_harness/v17_strong/**"
      - "lean_harness/v17_energy/**"
      - "lean_harness/v17_matching/**"
      - "lean_harness/v17_weighted/**"
      - "lean_harness/v17_threshold/**"
      - "lean_harness/v17_scalar/**"
      - "lean_harness/v17_adj/**"
      - "lean_harness/v17_analytic/**"
      - "lean_harness/frozen/**"
      - ".github/workflows/lean-v17-concrete-strong.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout exact Zeta23 upstream
        uses: actions/checkout@v4
        with:
          repository: anthropics/formal-math
          ref: fbdc36bbf17d20af3fd0447c6d1a8a02773c9844
          path: upstream

      - name: Overlay concrete v17 sources
        shell: bash
        run: |
          set -euxo pipefail
          cat harness/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C upstream/zeta23
          cat harness/lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/hurtado-analytic.tar.gz
          tar -xzf /tmp/hurtado-analytic.tar.gz -C upstream/zeta23

          cp harness/lean_harness/frozen/SpectralFrobenius.lean upstream/zeta23/HurtadoZeta23/SpectralFrobenius.lean
          cp harness/lean_harness/frozen/DiscreteCentralityBridge.lean upstream/zeta23/HurtadoZeta23/DiscreteCentralityBridge.lean
          cp harness/lean_harness/frozen/FiniteGridEndpointBridge.lean upstream/zeta23/HurtadoZeta23/FiniteGridEndpointBridge.lean
          cp harness/lean_harness/frozen/FourierL1.lean upstream/zeta23/HurtadoZeta23/FourierL1.lean
          cp harness/lean_harness/frozen/SevenPointCertificateBridge.lean upstream/zeta23/HurtadoZeta23/SevenPointCertificateBridge.lean
          cp harness/lean_harness/frozen/ExternalCertificateFrontier.lean upstream/zeta23/HurtadoZeta23/ExternalCertificateFrontier.lean

          cp harness/lean_harness/v17_scalar/V17StrongBlockScalar.lean upstream/zeta23/HurtadoZeta23/V17StrongBlockScalar.lean
          cp harness/lean_harness/v17_weighted/V17WeightedPressure.lean upstream/zeta23/HurtadoZeta23/V17WeightedPressure.lean

          cp harness/lean_harness/v17_adj/V17AdjacentPair.lean upstream/zeta23/HurtadoZeta23/V17AdjacentPair.lean
          cp harness/lean_harness/v17_matching/V17AdjacentMatching.lean upstream/zeta23/HurtadoZeta23/V17AdjacentMatching.lean
          cp harness/lean_harness/v17_matching/V17ConcreteMatching450.lean upstream/zeta23/HurtadoZeta23/V17ConcreteMatching450.lean
          cp harness/lean_harness/v17_matching/V17MatchingIndices.lean upstream/zeta23/HurtadoZeta23/V17MatchingIndices.lean
          cp harness/lean_harness/v17_matching/V17AdjacentBandScalar.lean upstream/zeta23/HurtadoZeta23/V17AdjacentBandScalar.lean
          cp harness/lean_harness/v17_matching/V17ParitySplit.lean upstream/zeta23/HurtadoZeta23/V17ParitySplit.lean
          cp harness/lean_harness/v17_matching/V17AdjacentBand450.lean upstream/zeta23/HurtadoZeta23/V17AdjacentBand450.lean

          cp harness/lean_harness/v17_threshold/V17SpectralThreshold.lean upstream/zeta23/HurtadoZeta23/V17SpectralThreshold.lean
          cp harness/lean_harness/v17_threshold/V17FiniteSpectralThreshold.lean upstream/zeta23/HurtadoZeta23/V17FiniteSpectralThreshold.lean
          cp harness/lean_harness/v17_threshold/V17TraceLeSpectralThreshold.lean upstream/zeta23/HurtadoZeta23/V17TraceLeSpectralThreshold.lean
          cp harness/lean_harness/v17_threshold/V17FrobeniusBridge.lean upstream/zeta23/HurtadoZeta23/V17FrobeniusBridge.lean
          cp harness/lean_harness/v17_threshold/V17GramThreshold450.lean upstream/zeta23/HurtadoZeta23/V17GramThreshold450.lean

          cp harness/lean_harness/v17_energy/V17KernelBridge450.lean upstream/zeta23/HurtadoZeta23/V17KernelBridge450.lean
          cp harness/lean_harness/v17_energy/V17PairBandReindexCore.lean upstream/zeta23/HurtadoZeta23/V17PairBandReindexCore.lean
          cp harness/lean_harness/v17_energy/V17MatrixEnergy450.lean upstream/zeta23/HurtadoZeta23/V17MatrixEnergy450.lean
          cp harness/lean_harness/v17_energy/V17ArticleSynthesisOverlapCore.lean upstream/zeta23/HurtadoZeta23/V17ArticleSynthesisOverlapCore.lean
          cp harness/lean_harness/v17_energy/V17PoissonGramBound.lean upstream/zeta23/HurtadoZeta23/V17PoissonGramBound.lean
          cp harness/lean_harness/v17_energy/V17CompactOverlapCore.lean upstream/zeta23/HurtadoZeta23/V17CompactOverlapCore.lean
          cp harness/lean_harness/v17_energy/V17AnalyticBridge450.lean upstream/zeta23/HurtadoZeta23/V17AnalyticBridge450.lean

          cp harness/lean_harness/v17_strong/V17StrongBlock450.lean upstream/zeta23/HurtadoZeta23/V17StrongBlock450.lean
          cp harness/lean_harness/v17_strong/V17StrongBlockMatrix450.lean upstream/zeta23/HurtadoZeta23/V17StrongBlockMatrix450.lean
          cp harness/lean_harness/v17_strong/V17ScalarPressureFrontier.lean upstream/zeta23/HurtadoZeta23/V17ScalarPressureFrontier.lean
          cp harness/lean_harness/v17_concrete/V17ConcreteStrongBlock450.lean upstream/zeta23/HurtadoZeta23/V17ConcreteStrongBlock450.lean

          cp harness/lean_harness/v17_endgame/V17Endgame.lean upstream/zeta23/HurtadoZeta23/V17Endgame.lean
          cp harness/lean_harness/v17_global/V17ShiftedPressure450.lean upstream/zeta23/HurtadoZeta23/V17ShiftedPressure450.lean
          cp harness/lean_harness/v17_global/V17ShiftedAssembly450.lean upstream/zeta23/HurtadoZeta23/V17ShiftedAssembly450.lean
          cp harness/lean_harness/v17_global/V17ShiftedGramPinching450.lean upstream/zeta23/HurtadoZeta23/V17ShiftedGramPinching450.lean
          cp harness/lean_harness/v17_global/V17ConcretePressure450.lean upstream/zeta23/HurtadoZeta23/V17ConcretePressure450.lean
          cp harness/lean_harness/v17_global/V17ConcreteShiftedAssembly450.lean upstream/zeta23/HurtadoZeta23/V17ConcreteShiftedAssembly450.lean

      - name: Register exact Hurtado import closure
        working-directory: upstream/zeta23
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          todo = ["HurtadoZeta23.V17ConcreteShiftedAssembly450"]
          seen = set()
          missing = []
          while todo:
              mod = todo.pop()
              if mod in seen:
                  continue
              seen.add(mod)
              path = Path(mod.replace('.', '/') + '.lean')
              if not path.exists():
                  missing.append((mod, '<root>'))
                  continue
              for line in path.read_text(encoding='utf-8').splitlines():
                  line = line.strip()
                  if not line.startswith('import '):
                      continue
                  for dep in line[len('import '):].split():
                      if dep.startswith('HurtadoZeta23.'):
                          dpath = Path(dep.replace('.', '/') + '.lean')
                          if dpath.exists():
                              todo.append(dep)
                          else:
                              missing.append((dep, mod))
          if missing:
              print('Missing Hurtado imports:')
              for dep, parent in missing:
                  print(f'  {parent} -> {dep}')
              raise SystemExit(1)
          roots = sorted(seen)
          print(f'Registering {len(roots)} modules in exact import closure')
          with open('lakefile.toml', 'a', encoding='utf-8') as f:
              f.write('\n[[lean_lib]]\n')
              f.write('name = "HurtadoZeta23V17ConcreteStrong"\n')
              f.write('roots = [\n')
              for i, mod in enumerate(roots):
                  comma = ',' if i + 1 < len(roots) else ''
                  f.write(f'  "{mod}"{comma}\n')
              f.write(']\n')
          PY

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd upstream/zeta23
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Fetch mathlib cache
        working-directory: upstream/zeta23
        shell: bash
        run: lake exe cache get

      - name: Build concrete shifted assembly
        working-directory: upstream/zeta23
        shell: bash
        run: lake build HurtadoZeta23V17ConcreteStrong
