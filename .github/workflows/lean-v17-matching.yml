name: Lean v17 finite matching core

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - "lean_harness/v17_adj/V17AdjacentPair.lean"
      - "lean_harness/v17_matching/**"
      - ".github/workflows/lean-v17-matching.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout exact Zeta23 upstream
        uses: actions/checkout@v4
        with:
          repository: anthropics/formal-math
          ref: fbdc36bbf17d20af3fd0447c6d1a8a02773c9844
          path: upstream

      - name: Overlay matching modules
        shell: bash
        run: |
          set -euxo pipefail
          cat harness/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C upstream/zeta23
          cp harness/lean_harness/v17_adj/V17AdjacentPair.lean upstream/zeta23/HurtadoZeta23/V17AdjacentPair.lean
          cp harness/lean_harness/v17_matching/V17AdjacentMatching.lean upstream/zeta23/HurtadoZeta23/V17AdjacentMatching.lean
          cp harness/lean_harness/v17_matching/V17ConcreteMatching450.lean upstream/zeta23/HurtadoZeta23/V17ConcreteMatching450.lean
          cp harness/lean_harness/v17_matching/V17MatchingIndices.lean upstream/zeta23/HurtadoZeta23/V17MatchingIndices.lean
          cp harness/lean_harness/v17_matching/V17AdjacentBandScalar.lean upstream/zeta23/HurtadoZeta23/V17AdjacentBandScalar.lean
          cp harness/lean_harness/v17_matching/V17ParitySplit.lean upstream/zeta23/HurtadoZeta23/V17ParitySplit.lean
          cp harness/lean_harness/v17_matching/V17AdjacentBand450.lean upstream/zeta23/HurtadoZeta23/V17AdjacentBand450.lean

      - name: Register exact Hurtado import closure
        working-directory: upstream/zeta23
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          start = ["HurtadoZeta23.V17AdjacentBand450"]
          todo = list(start)
          seen = set()
          missing = []

          while todo:
              mod = todo.pop()
              if mod in seen:
                  continue
              seen.add(mod)
              path = Path(mod.replace('.', '/') + '.lean')
              if not path.exists():
                  missing.append((mod, '<root>'))
                  continue
              for line in path.read_text(encoding='utf-8').splitlines():
                  line = line.strip()
                  if not line.startswith('import '):
                      continue
                  for dep in line[len('import '):].split():
                      if not dep.startswith('HurtadoZeta23.'):
                          continue
                      dpath = Path(dep.replace('.', '/') + '.lean')
                      if dpath.exists():
                          todo.append(dep)
                      else:
                          missing.append((dep, mod))

          if missing:
              print('Missing Hurtado imports:')
              for dep, parent in missing:
                  print(f'  {parent} -> {dep}')
              raise SystemExit(1)

          roots = sorted(seen)
          print(f'Registering {len(roots)} modules in exact import closure')
          with open('lakefile.toml', 'a', encoding='utf-8') as f:
              f.write('\n[[lean_lib]]\n')
              f.write('name = "HurtadoZeta23V17Matching"\n')
              f.write('roots = [\n')
              for i, mod in enumerate(roots):
                  comma = ',' if i + 1 < len(roots) else ''
                  f.write(f'  "{mod}"{comma}\n')
              f.write(']\n')
          PY

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd upstream/zeta23
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Fetch mathlib cache
        working-directory: upstream/zeta23
        shell: bash
        run: lake exe cache get

      - name: Build finite matching core
        working-directory: upstream/zeta23
        shell: bash
        run: lake build HurtadoZeta23V17Matching
