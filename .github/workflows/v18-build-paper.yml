name: Build and audit v18 manuscript PDF

on:
  push:
    branches: [v18-editorial-provenance-audit]
    paths:
      - "paper/main.tex"
      - "docs/V18_ADVERSARIAL_AUDIT.md"
      - ".github/workflows/v18-build-paper.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v18-editorial-provenance-audit
          fetch-depth: 0

      - name: Adversarial source gates
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nF '\\cite{Claude26}' paper/main.tex
          ! grep -niE 'immutable (release|snapshot|artifact)' paper/main.tex
          ! grep -nF 'Theorem D as an imported black box' paper/main.tex
          grep -nF '\\cite{AlpogeFurman26}' paper/main.tex
          grep -nF '\\cite{Lamzouri26}' paper/main.tex
          grep -nF '\\cite{AnthropicFormal26}' paper/main.tex
          grep -nF 'fbdc36bbf17d20af3fd0447c6d1a8a02773c9844' paper/main.tex
          grep -nF 'no claim here that the' paper/main.tex
          grep -nF '0.6733127422722459' paper/main.tex
          grep -nF '0.673399' paper/main.tex

      - name: Install TeX
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended texlive-latex-extra

      - name: Compile manuscript twice
        working-directory: paper
        shell: bash
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf

      - name: Fail on unresolved references or citations
        working-directory: paper
        shell: bash
        run: |
          set -euo pipefail
          if grep -E 'LaTeX Warning: (There were undefined references|Citation .* undefined|Reference .* undefined)' main.log; then
            echo 'Unresolved citation/reference warnings remain.' >&2
            exit 1
          fi

      - name: Commit rebuilt PDF
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- paper/main.pdf; then
            echo 'PDF unchanged.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.pdf
          git commit -m "Rebuild v18 manuscript PDF"
          git push origin HEAD:v18-editorial-provenance-audit
