name: v21 kernel derivative smoke

on:
  push:
    branches: [v21-analytic-seven-point]
    paths:
      - 'lean_harness/v20_analytic/**'
      - 'lean_harness/v21_analytic/V21TaylorTools.lean'
      - 'lean_harness/v21_analytic/V21KernelClosedForm.lean'
      - 'lean_harness/v21_analytic/V21KernelNormalized.lean'
      - 'lean_harness/v21_analytic/V21KernelCellTools.lean'
      - 'lean_harness/v21_analytic/V21KernelDerivatives.lean'
      - 'lean_harness/v21_analytic/V21KernelSecondDerivatives.lean'
      - 'lean_harness/v21_analytic/V21KernelSecondDerivativeSigns.lean'
      - 'lean_harness/v21_analytic/V21KernelCurvatureSigns.lean'
      - 'lean_harness/v21_analytic/V21KernelEndpointBounds.lean'
      - 'lean_harness/v21_analytic/V21KernelFirstLobeSign.lean'
      - 'lean_harness/v21_analytic/V21KernelFirstLobeQuantitative.lean'
      - 'lean_harness/v21_analytic/V21FirstGapExclusion.lean'
      - 'lean_harness/v21_analytic/V21KernelHigherEndpointBounds.lean'
      - 'lean_harness/v21_analytic/V21KernelThirdLobeEndpoints.lean'
      - 'lean_harness/v21_analytic/V21KernelIntervalCurvature.lean'
      - 'lean_harness/v21_analytic/V21UniformGapExclusionsAnalytic.lean'
      - 'lean_harness/v21_analytic/V21GapBandReduction.lean'
      - '.github/workflows/v21-derivative-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derivative-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct pinned proof environment
        run: |
          git clone https://github.com/anthropics/formal-math.git /tmp/formal-math
          cd /tmp/formal-math
          git checkout fbdc36bbf17d20af3fd0447c6d1a8a02773c9844
          cd zeta23
          mkdir -p HurtadoZeta23
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/a.tar.gz
          tar -xzf /tmp/a.tar.gz -C .
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/b.tar.gz
          tar -xzf /tmp/b.tar.gz -C .
          find "$GITHUB_WORKSPACE/lean_harness" -name '*.lean' \
            -not -path '*/v20_analytic/*' -not -path '*/v21_analytic/*' -print0 | while IFS= read -r -d '' f; do
              cp "$f" "HurtadoZeta23/$(basename "$f")"
          done
          cp "$GITHUB_WORKSPACE"/lean_harness/v20_analytic/*.lean HurtadoZeta23/
          cp "$GITHUB_WORKSPACE"/lean_harness/v21_analytic/*.lean HurtadoZeta23/
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23"
          roots = ["HurtadoZeta23"]
          EOF
      - name: Fetch Mathlib cache
        run: cd /tmp/formal-math/zeta23 && lake exe cache get
      - name: Restore green kernel-base cache
        id: kernel-base-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/formal-math/zeta23/.lake/build
          key: v21-kernel-base-${{ runner.os }}-lean433rc2-${{ hashFiles('lean_harness/v21_analytic/V21TaylorTools.lean', 'lean_harness/v21_analytic/V21KernelClosedForm.lean', 'lean_harness/v21_analytic/V21KernelNormalized.lean', 'lean_harness/v21_analytic/V21KernelCellTools.lean') }}
      - name: Build Taylor tools
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21TaylorTools
      - name: Build normalized kernel
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21KernelNormalized
      - name: Build kernel cell tools
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21KernelCellTools
      - name: Save green kernel-base cache
        if: steps.kernel-base-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/formal-math/zeta23/.lake/build
          key: ${{ steps.kernel-base-cache.outputs.cache-primary-key }}
      - name: Build first derivative
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21KernelDerivatives
      - name: Build second derivative
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21KernelSecondDerivatives
      - name: Build second-derivative signs
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21KernelSecondDerivativeSigns
      - name: Build curvature signs
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21KernelCurvatureSigns
      - name: Build endpoint bounds
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21KernelEndpointBounds
      - name: Build first-lobe sign
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21KernelFirstLobeSign
      - name: Build quantitative first-lobe bound
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21KernelFirstLobeQuantitative
      - name: Build first gap exclusion
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21FirstGapExclusion
      - name: Build second-lobe endpoints
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21KernelHigherEndpointBounds
      - name: Build third-lobe endpoints
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21KernelThirdLobeEndpoints
      - name: Build interval curvature
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21KernelIntervalCurvature
      - name: Build uniform gap exclusions
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21UniformGapExclusionsAnalytic
      - name: Build survivor-band reduction
        run: cd /tmp/formal-math/zeta23 && lake build HurtadoZeta23.V21GapBandReduction
      - name: Reject placeholders and trusted declarations
        run: |
          ! grep -nE '\bsorry\b|\badmit\b|^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21TaylorTools.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21KernelNormalized.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21KernelCellTools.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21KernelDerivatives.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21KernelSecondDerivatives.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21KernelSecondDerivativeSigns.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21KernelCurvatureSigns.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21KernelEndpointBounds.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21KernelFirstLobeSign.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21KernelFirstLobeQuantitative.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21FirstGapExclusion.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21KernelHigherEndpointBounds.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21KernelThirdLobeEndpoints.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21KernelIntervalCurvature.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21UniformGapExclusionsAnalytic.lean" \
            "$GITHUB_WORKSPACE/lean_harness/v21_analytic/V21GapBandReduction.lean"
