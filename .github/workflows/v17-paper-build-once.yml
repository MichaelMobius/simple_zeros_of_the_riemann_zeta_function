name: Build v17 paper once

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - ".github/workflows/v17-paper-build-once.yml"

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: lean-v17-adaptation
          fetch-depth: 0

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -interaction=nonstopmode -halt-on-error

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: v17-paper-pdf
          path: paper/main.pdf
          if-no-files-found: error

      - name: Commit compiled PDF
        run: |
          git config user.name "Michael Hurtado"
          git config user.email "mhe777@gmail.com"
          git add paper/main.pdf
          if git diff --cached --quiet; then
            echo "paper/main.pdf already up to date"
          else
            git commit -m "Rebuild v17 manuscript PDF"
            git push origin HEAD:lean-v17-adaptation
          fi
