name: research nine-point hybrid scalar

on:
  push:
    branches: [research/master-certificate-v1]
    paths:
      - 'lean_harness/research/ResearchNinePointHybrid.lean'
      - 'lean_harness/research/ResearchWindowKernel086v2.lean'
      - 'research/master_certificate_v1/verify_window_kernel_086.py'
      - '.github/workflows/research-nine-point-hybrid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Exact-rational kernel reproduction
        run: python3 research/master_certificate_v1/verify_window_kernel_086.py

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned formal-math/zeta23 base
        run: |
          git clone https://github.com/anthropics/formal-math.git /tmp/formal-math
          cd /tmp/formal-math
          git checkout fbdc36bbf17d20af3fd0447c6d1a8a02773c9844

      - name: Install research modules
        run: |
          cd /tmp/formal-math/zeta23
          mkdir -p HurtadoZeta23
          cp "$GITHUB_WORKSPACE"/lean_harness/research/ResearchNinePointHybrid.lean \
             HurtadoZeta23/ResearchNinePointHybrid.lean
          cp "$GITHUB_WORKSPACE"/lean_harness/research/ResearchWindowKernel086v2.lean \
             HurtadoZeta23/ResearchWindowKernel086v2.lean
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoResearchNinePointHybrid"
          roots = [
            "HurtadoZeta23.ResearchNinePointHybrid",
            "HurtadoZeta23.ResearchWindowKernel086v2"
          ]
          EOF

      - name: Fetch mathlib cache
        run: |
          cd /tmp/formal-math/zeta23
          lake exe cache get

      - name: Build research modules
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoResearchNinePointHybrid

      - name: Axiom report
        run: |
          cd /tmp/formal-math/zeta23
          cat > /tmp/ResearchNinePointHybridAudit.lean <<'EOF'
          import HurtadoZeta23.ResearchNinePointHybrid
          import HurtadoZeta23.ResearchWindowKernel086v2
          #check HurtadoZeta23.research9_strong_block_scalar
          #check HurtadoZeta23.research9_projected_bound_exact
          #check HurtadoZeta23.research9v2_window_kernel_closed_gt
          #print axioms HurtadoZeta23.research9_strong_block_scalar
          #print axioms HurtadoZeta23.research9_projected_bound_exact
          #print axioms HurtadoZeta23.research9v2_window_kernel_closed_gt
          EOF
          lake env lean /tmp/ResearchNinePointHybridAudit.lean
