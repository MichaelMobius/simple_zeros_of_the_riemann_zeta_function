name: research nine-point hybrid scalar

on:
  push:
    branches: [research/master-certificate-v1]
    paths:
      - 'lean_harness/research/**'
      - 'lean_harness/v17_threshold/V17FrobeniusBridge.lean'
      - 'lean_harness/frozen/SpectralFrobenius.lean'
      - 'research/master_certificate_v1/verify_window_kernel_086.py'
      - '.github/workflows/research-nine-point-hybrid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Exact-rational kernel reproduction
        run: python3 research/master_certificate_v1/verify_window_kernel_086.py

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned formal-math/zeta23 base
        run: |
          git clone https://github.com/anthropics/formal-math.git /tmp/formal-math
          cd /tmp/formal-math
          git checkout fbdc36bbf17d20af3fd0447c6d1a8a02773c9844

      - name: Install research modules and exact v17 linear-algebra support
        run: |
          set -euxo pipefail
          cd /tmp/formal-math/zeta23
          mkdir -p HurtadoZeta23

          cat "$GITHUB_WORKSPACE"/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C /tmp/formal-math/zeta23
          cp "$GITHUB_WORKSPACE"/lean_harness/frozen/SpectralFrobenius.lean \
             HurtadoZeta23/SpectralFrobenius.lean
          cp "$GITHUB_WORKSPACE"/lean_harness/v17_threshold/V17FrobeniusBridge.lean \
             HurtadoZeta23/V17FrobeniusBridge.lean

          for f in "$GITHUB_WORKSPACE"/lean_harness/research/*.lean; do
            cp "$f" "HurtadoZeta23/$(basename "$f")"
          done

      - name: Register exact Hurtado import closure
        working-directory: /tmp/formal-math/zeta23
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          start = [
              "HurtadoZeta23.ResearchNinePointHybrid",
              "HurtadoZeta23.ResearchWindowKernel086v2",
              "HurtadoZeta23.ResearchWindowKernelBridge",
              "HurtadoZeta23.ResearchWindowActual",
              "HurtadoZeta23.ResearchWindowPositivity",
              "HurtadoZeta23.ResearchWeightedPressure289",
              "HurtadoZeta23.ResearchSpectralThreshold289",
              "HurtadoZeta23.ResearchTraceLeSpectralThreshold289",
              "HurtadoZeta23.ResearchGramThreshold289",
              "HurtadoZeta23.ResearchStrongBlock289",
              "HurtadoZeta23.ResearchHybridInterfaces289",
              "HurtadoZeta23.ResearchAdjacentBand289",
              "HurtadoZeta23.ResearchShiftedAssembly289",
              "HurtadoZeta23.ResearchLiminfEndpoint",
              "HurtadoZeta23.ResearchEndgame289",
          ]
          todo = list(start)
          seen = set()
          missing = []

          while todo:
              mod = todo.pop()
              if mod in seen:
                  continue
              seen.add(mod)
              path = Path(mod.replace('.', '/') + '.lean')
              if not path.exists():
                  missing.append((mod, '<root>'))
                  continue
              for line in path.read_text(encoding='utf-8').splitlines():
                  line = line.strip()
                  if not line.startswith('import '):
                      continue
                  for dep in line[len('import '):].split():
                      if not dep.startswith('HurtadoZeta23.'):
                          continue
                      dpath = Path(dep.replace('.', '/') + '.lean')
                      if dpath.exists():
                          todo.append(dep)
                      else:
                          missing.append((dep, mod))

          if missing:
              print('Missing Hurtado imports:')
              for dep, parent in missing:
                  print(f'  {parent} -> {dep}')
              raise SystemExit(1)

          roots = sorted(seen)
          print(f'Registering {len(roots)} modules in exact import closure')
          with open('lakefile.toml', 'a', encoding='utf-8') as f:
              f.write('\n[[lean_lib]]\n')
              f.write('name = "HurtadoResearchNinePointHybrid"\n')
              f.write('roots = [\n')
              for i, mod in enumerate(roots):
                  comma = ',' if i + 1 < len(roots) else ''
                  f.write(f'  "{mod}"{comma}\n')
              f.write(']\n')
          PY

      - name: Fetch mathlib cache
        run: |
          cd /tmp/formal-math/zeta23
          lake exe cache get

      - name: Build research modules
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoResearchNinePointHybrid

      - name: Axiom report
        run: |
          cd /tmp/formal-math/zeta23
          cat > /tmp/ResearchNinePointHybridAudit.lean <<'EOF'
          import HurtadoZeta23.ResearchNinePointHybrid
          import HurtadoZeta23.ResearchWindowKernel086v2
          import HurtadoZeta23.ResearchWindowKernelBridge
          import HurtadoZeta23.ResearchWindowActual
          import HurtadoZeta23.ResearchWindowPositivity
          import HurtadoZeta23.ResearchWeightedPressure289
          import HurtadoZeta23.ResearchSpectralThreshold289
          import HurtadoZeta23.ResearchTraceLeSpectralThreshold289
          import HurtadoZeta23.ResearchGramThreshold289
          import HurtadoZeta23.ResearchStrongBlock289
          import HurtadoZeta23.ResearchHybridInterfaces289
          import HurtadoZeta23.ResearchAdjacentBand289
          import HurtadoZeta23.ResearchShiftedAssembly289
          import HurtadoZeta23.ResearchLiminfEndpoint
          import HurtadoZeta23.ResearchEndgame289

          #check HurtadoZeta23.research9_window_integral_ratio086_gt
          #check HurtadoZeta23.research9_window_pos
          #check HurtadoZeta23.research9_window_kernel_antitoneOn
          #check HurtadoZeta23.research9_window_one_gap_pressure
          #check HurtadoZeta23.research9_spectral_threshold_fin289_sum_le
          #check HurtadoZeta23.research9_psd_gram_threshold_289_of_diag
          #check HurtadoZeta23.research9_adjacent_matrix_band_le_defect_289
          #check HurtadoZeta23.research9_strong_block_289_of_matrix_interfaces
          #check HurtadoZeta23.research9_weighted_block_pressure_fin288
          #check HurtadoZeta23.research9_strong_block_289_from_finite_interfaces
          #check HurtadoZeta23.research9_shifted_assembly_from_uniform_blocks
          #check HurtadoZeta23.research9_projectedBound_eq_global_coefficients
          #check HurtadoZeta23.research9_liminf_of_eps_form
          #check HurtadoZeta23.research9_projected_liminf_from_global_refinement

          #print axioms HurtadoZeta23.research9_window_integral_ratio086_gt
          #print axioms HurtadoZeta23.research9_window_pos
          #print axioms HurtadoZeta23.research9_window_kernel_antitoneOn
          #print axioms HurtadoZeta23.research9_window_one_gap_pressure
          #print axioms HurtadoZeta23.research9_spectral_threshold_fin289_sum_le
          #print axioms HurtadoZeta23.research9_psd_gram_threshold_289_of_diag
          #print axioms HurtadoZeta23.research9_adjacent_matrix_band_le_defect_289
          #print axioms HurtadoZeta23.research9_strong_block_289_of_matrix_interfaces
          #print axioms HurtadoZeta23.research9_weighted_block_pressure_fin288
          #print axioms HurtadoZeta23.research9_strong_block_289_from_finite_interfaces
          #print axioms HurtadoZeta23.research9_shifted_assembly_from_uniform_blocks
          #print axioms HurtadoZeta23.research9_projectedBound_eq_global_coefficients
          #print axioms HurtadoZeta23.research9_liminf_of_eps_form
          #print axioms HurtadoZeta23.research9_projected_liminf_from_global_refinement
          EOF
          lake env lean /tmp/ResearchNinePointHybridAudit.lean
