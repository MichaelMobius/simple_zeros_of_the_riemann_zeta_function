name: Lean v17 endgame

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - "lean_harness/v17_endgame/**"
      - ".github/workflows/lean-v17-endgame.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout exact Zeta23 upstream
        uses: actions/checkout@v4
        with:
          repository: anthropics/formal-math
          ref: fbdc36bbf17d20af3fd0447c6d1a8a02773c9844
          path: upstream

      - name: Overlay constants and v17 endgame
        shell: bash
        run: |
          set -euxo pipefail
          cat harness/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C upstream/zeta23
          cp harness/lean_harness/v17_endgame/V17Endgame.lean upstream/zeta23/HurtadoZeta23/V17Endgame.lean
          cat >> upstream/zeta23/lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23V17Endgame"
          roots = ["HurtadoZeta23.Constants", "HurtadoZeta23.V17Endgame"]
          EOF

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd upstream/zeta23
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Fetch mathlib cache
        working-directory: upstream/zeta23
        shell: bash
        run: lake exe cache get

      - name: Build v17 endgame
        working-directory: upstream/zeta23
        shell: bash
        run: lake build HurtadoZeta23V17Endgame
