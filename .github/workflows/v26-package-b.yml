name: v26 package B rational bootstrap

on:
  push:
    branches: [v26-lean-verification]
    paths:
      - 'certification/v26_exact/**'
      - '.github/workflows/v26-package-b.yml'
      - 'lean_harness/v21_analytic/V26BootstrapStageLists.lean'
      - 'lean_harness/v21_analytic/V26QuadraticCore.lean'
      - 'lean_harness/v21_analytic/V26Word511Certificate.lean'
      - 'lean_harness/v21_analytic/V26WordBridge.lean'
  workflow_dispatch:

concurrency:
  group: v26-package-b-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned formal-math/zeta23 base
        run: |
          git clone https://github.com/anthropics/formal-math.git /tmp/formal-math
          cd /tmp/formal-math
          git checkout fbdc36bbf17d20af3fd0447c6d1a8a02773c9844

      - name: Reconstruct HurtadoZeta23 source overlay
        run: |
          cd /tmp/formal-math/zeta23
          mkdir -p HurtadoZeta23
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/hurtado-analytic.tar.gz
          tar -xzf /tmp/hurtado-analytic.tar.gz -C .
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado-adj.tar.gz
          tar -xzf /tmp/hurtado-adj.tar.gz -C .
          find "$GITHUB_WORKSPACE"/lean_harness -name '*.lean' -not -path '*/v20_analytic/*' -not -path '*/v21_analytic/*' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "HurtadoZeta23/$(basename "$f")"
          done
          cp "$GITHUB_WORKSPACE"/lean_harness/v20_analytic/*.lean HurtadoZeta23/
          cp "$GITHUB_WORKSPACE"/lean_harness/v21_analytic/*.lean HurtadoZeta23/
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23"
          roots = ["HurtadoZeta23"]
          EOF

      - name: Regenerate exact historical rational certificate
        run: |
          python certification/v26_exact/v21_rational_bootstrap_verify.py
          echo '5234366c615d599a7afd3f85bf82cb04272a158171e5e5fb144fcf23941b0eb4  /mnt/data/v21_rational_bootstrap_certificate.json' | sha256sum -c -

      - name: Generate exact Lean discard certificates
        run: |
          python certification/v26_exact/generate_v26_bootstrap_lean.py --out-dir /tmp/formal-math/zeta23/HurtadoZeta23
          if grep -R -n -E '\b(sorry|admit|axiom|opaque|unsafe|native_decide)\b' /tmp/formal-math/zeta23/HurtadoZeta23/V26Bootstrap*.lean; then
            echo 'Forbidden proof shortcut found in generated certificate'
            exit 1
          fi

      - name: Fetch mathlib cache
        run: |
          cd /tmp/formal-math/zeta23
          lake exe cache get

      - name: Kernel-check all generated rational discards
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26BootstrapDiscardGenerated
