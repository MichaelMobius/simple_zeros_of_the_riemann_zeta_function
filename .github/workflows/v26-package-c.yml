name: v26 package C certified phase roots

on:
  push:
    branches: [v26-lean-verification]
    paths:
      - 'lean_harness/v21_analytic/V21KernelRootBrackets.lean'
      - 'lean_harness/v21_analytic/V21KernelRootBracketsLow.lean'
      - 'lean_harness/v21_analytic/V21KernelRootBracketsMid.lean'
      - 'lean_harness/v21_analytic/V21KernelRootBracketsHigh.lean'
      - 'lean_harness/v21_analytic/V21KernelRootSlope.lean'
      - 'lean_harness/v21_analytic/V21KernelRootCatalog.lean'
      - 'lean_harness/v21_analytic/V21KernelRootGrowth.lean'
      - 'lean_harness/v21_analytic/V21KernelRootQuadratic.lean'
      - 'lean_harness/v21_analytic/V21KernelRootWeight.lean'
      - 'lean_harness/v21_analytic/V26CertifiedPhaseRoots.lean'
      - '.github/workflows/v26-package-c.yml'
  workflow_dispatch:

concurrency:
  group: v26-package-c-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned formal-math/zeta23 base
        run: |
          git clone https://github.com/anthropics/formal-math.git /tmp/formal-math
          cd /tmp/formal-math
          git checkout fbdc36bbf17d20af3fd0447c6d1a8a02773c9844

      - name: Reconstruct HurtadoZeta23 source overlay
        run: |
          cd /tmp/formal-math/zeta23
          mkdir -p HurtadoZeta23
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/hurtado-analytic.tar.gz
          tar -xzf /tmp/hurtado-analytic.tar.gz -C .
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado-adj.tar.gz
          tar -xzf /tmp/hurtado-adj.tar.gz -C .
          find "$GITHUB_WORKSPACE"/lean_harness -name '*.lean' -not -path '*/v20_analytic/*' -not -path '*/v21_analytic/*' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "HurtadoZeta23/$(basename "$f")"
          done
          cp "$GITHUB_WORKSPACE"/lean_harness/v20_analytic/*.lean HurtadoZeta23/
          cp "$GITHUB_WORKSPACE"/lean_harness/v21_analytic/*.lean HurtadoZeta23/
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23"
          roots = ["HurtadoZeta23"]
          EOF

      - name: Reject forbidden proof shortcuts
        run: |
          if grep -R -n -E '\b(sorry|admit|axiom|opaque|unsafe|native_decide)\b' \
            lean_harness/v21_analytic/V21KernelRoot*.lean \
            lean_harness/v21_analytic/V26CertifiedPhaseRoots.lean; then
            echo 'Forbidden proof shortcut found in package C'
            exit 1
          fi

      - name: Fetch mathlib cache
        run: |
          cd /tmp/formal-math/zeta23
          lake exe cache get

      - name: Verify certified root chain
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V21KernelRootQuadratic
          lake build HurtadoZeta23.V21KernelRootWeight

      - name: Verify v26 phase-root bridge
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26CertifiedPhaseRoots
