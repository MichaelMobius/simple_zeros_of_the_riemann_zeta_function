name: Lean v17 strong block 450

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - "lean_harness/v17_strong/**"
      - "lean_harness/v17_energy/**"
      - "lean_harness/v17_matching/**"
      - "lean_harness/v17_weighted/**"
      - "lean_harness/v17_threshold/**"
      - "lean_harness/v17_scalar/**"
      - "lean_harness/frozen/**"
      - ".github/workflows/lean-v17-strong-block.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout exact Zeta23 upstream
        uses: actions/checkout@v4
        with:
          repository: anthropics/formal-math
          ref: fbdc36bbf17d20af3fd0447c6d1a8a02773c9844
          path: upstream

      - name: Overlay strong-block modules
        shell: bash
        run: |
          set -euxo pipefail
          cat harness/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C upstream/zeta23

          cp harness/lean_harness/frozen/ConcreteBlockDefect.lean upstream/zeta23/HurtadoZeta23/ConcreteBlockDefect.lean
          cp harness/lean_harness/frozen/ConsecutiveBlockStabilityBridge.lean upstream/zeta23/HurtadoZeta23/ConsecutiveBlockStabilityBridge.lean
          cp harness/lean_harness/frozen/SpectralFrobenius.lean upstream/zeta23/HurtadoZeta23/SpectralFrobenius.lean
          cp harness/lean_harness/frozen/ConcreteCompactOverlapInputIV.lean upstream/zeta23/HurtadoZeta23/ConcreteCompactOverlapInputIV.lean
          cp harness/lean_harness/frozen/FiniteGridEndpointBridge.lean upstream/zeta23/HurtadoZeta23/FiniteGridEndpointBridge.lean
          cp harness/lean_harness/frozen/PoissonGramUnitBound.lean upstream/zeta23/HurtadoZeta23/PoissonGramUnitBound.lean
          cp harness/lean_harness/frozen/ConcreteRawOverlapReduction.lean upstream/zeta23/HurtadoZeta23/ConcreteRawOverlapReduction.lean
          cp harness/lean_harness/frozen/ConcreteFiniteClosure.lean upstream/zeta23/HurtadoZeta23/ConcreteFiniteClosure.lean
          cp harness/lean_harness/frozen/GramPairEnergyIdentity.lean upstream/zeta23/HurtadoZeta23/GramPairEnergyIdentity.lean

          cp harness/lean_harness/v17_scalar/V17StrongBlockScalar.lean upstream/zeta23/HurtadoZeta23/V17StrongBlockScalar.lean

          cp harness/lean_harness/v17_energy/V17KernelBridge450.lean upstream/zeta23/HurtadoZeta23/V17KernelBridge450.lean
          cp harness/lean_harness/v17_energy/V17OffDiagonalSplit.lean upstream/zeta23/HurtadoZeta23/V17OffDiagonalSplit.lean
          cp harness/lean_harness/v17_energy/V17PairBands.lean upstream/zeta23/HurtadoZeta23/V17PairBands.lean
          cp harness/lean_harness/v17_energy/V17PoissonTail.lean upstream/zeta23/HurtadoZeta23/V17PoissonTail.lean
          cp harness/lean_harness/v17_energy/V17AnalyticBridge450.lean upstream/zeta23/HurtadoZeta23/V17AnalyticBridge450.lean
          cp harness/lean_harness/v17_energy/V17GramEnergy450.lean upstream/zeta23/HurtadoZeta23/V17GramEnergy450.lean

          cp harness/lean_harness/v17_adj/V17AdjacentPair.lean upstream/zeta23/HurtadoZeta23/V17AdjacentPair.lean
          cp harness/lean_harness/v17_matching/V17AdjacentMatching.lean upstream/zeta23/HurtadoZeta23/V17AdjacentMatching.lean
          cp harness/lean_harness/v17_matching/V17ConcreteMatching450.lean upstream/zeta23/HurtadoZeta23/V17ConcreteMatching450.lean
          cp harness/lean_harness/v17_matching/V17MatchingIndices.lean upstream/zeta23/HurtadoZeta23/V17MatchingIndices.lean
          cp harness/lean_harness/v17_matching/V17AdjacentBandScalar.lean upstream/zeta23/HurtadoZeta23/V17AdjacentBandScalar.lean
          cp harness/lean_harness/v17_matching/V17ParitySplit.lean upstream/zeta23/HurtadoZeta23/V17ParitySplit.lean
          cp harness/lean_harness/v17_matching/V17AdjacentBand450.lean upstream/zeta23/HurtadoZeta23/V17AdjacentBand450.lean

          cp harness/lean_harness/v17_weighted/V17ScalarPressure.lean upstream/zeta23/HurtadoZeta23/V17ScalarPressure.lean
          cp harness/lean_harness/v17_weighted/V17WeightedPressure.lean upstream/zeta23/HurtadoZeta23/V17WeightedPressure.lean

          cp harness/lean_harness/v17_threshold/V17SpectralThreshold.lean upstream/zeta23/HurtadoZeta23/V17SpectralThreshold.lean
          cp harness/lean_harness/v17_threshold/V17FiniteSpectralThreshold.lean upstream/zeta23/HurtadoZeta23/V17FiniteSpectralThreshold.lean
          cp harness/lean_harness/v17_threshold/V17TraceLeSpectralThreshold.lean upstream/zeta23/HurtadoZeta23/V17TraceLeSpectralThreshold.lean
          cp harness/lean_harness/v17_threshold/V17GramThreshold450.lean upstream/zeta23/HurtadoZeta23/V17GramThreshold450.lean

          cp harness/lean_harness/v17_strong/V17StrongBlock450.lean upstream/zeta23/HurtadoZeta23/V17StrongBlock450.lean

          cat >> upstream/zeta23/lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23V17StrongBlock"
          roots = ["HurtadoZeta23.ArticleSynthesisOverlapBridge",
            "HurtadoZeta23.ArticleSynthesisOverlapClosed",
            "HurtadoZeta23.BlockDefect",
            "HurtadoZeta23.BlockStability",
            "HurtadoZeta23.CharpolyGramBridge",
            "HurtadoZeta23.CompactOverlapLimit",
            "HurtadoZeta23.ConcreteAsymptoticInputs",
            "HurtadoZeta23.ConcreteBlockDefect",
            "HurtadoZeta23.ConcreteCompactOverlapAssembly",
            "HurtadoZeta23.ConcreteCompactOverlapInputIV",
            "HurtadoZeta23.ConcreteFiniteClosure",
            "HurtadoZeta23.ConcreteGramClosedAssembly",
            "HurtadoZeta23.ConcreteGridTailBound",
            "HurtadoZeta23.ConcreteRawOverlapPoisson",
            "HurtadoZeta23.ConcreteRawOverlapReduction",
            "HurtadoZeta23.ConcreteRetainedCore",
            "HurtadoZeta23.ConcreteShiftedPinching",
            "HurtadoZeta23.ConcreteStableCore",
            "HurtadoZeta23.ConcreteStableSeam",
            "HurtadoZeta23.ConsecutiveBlockStabilityBridge",
            "HurtadoZeta23.ConsecutiveGramBlocks",
            "HurtadoZeta23.ConsecutiveGramOverlapBridge",
            "HurtadoZeta23.ConsecutiveGramRealEntries",
            "HurtadoZeta23.Constants",
            "HurtadoZeta23.CriticalLatticeGeometry",
            "HurtadoZeta23.DirectRedistribution",
            "HurtadoZeta23.DiscreteCentralityBridge",
            "HurtadoZeta23.Endgame",
            "HurtadoZeta23.ExactTsumDecomposition",
            "HurtadoZeta23.ExternalCertificateFrontier",
            "HurtadoZeta23.FiniteGridEndpointBridge",
            "HurtadoZeta23.FiniteGridTruncation",
            "HurtadoZeta23.FourierConventionAdapter",
            "HurtadoZeta23.FourierL1",
            "HurtadoZeta23.GlobalAssembly",
            "HurtadoZeta23.GramPairEnergyIdentity",
            "HurtadoZeta23.GramPinching",
            "HurtadoZeta23.GramPinchingBlockDiagonal",
            "HurtadoZeta23.GramPinchingConvex",
            "HurtadoZeta23.GramPinchingFinitePartition",
            "HurtadoZeta23.GramPinchingInvariant",
            "HurtadoZeta23.GramPinchingPositivePart",
            "HurtadoZeta23.GramPinchingVariational",
            "HurtadoZeta23.GramSpectrumBridge",
            "HurtadoZeta23.InfiniteLatticeAssembly",
            "HurtadoZeta23.IntegerHalfLineEquiv",
            "HurtadoZeta23.IntegerLatticePartition",
            "HurtadoZeta23.InteriorBoundaryBridge",
            "HurtadoZeta23.InteriorBoundaryElementary",
            "HurtadoZeta23.InteriorBoundaryUnitCover",
            "HurtadoZeta23.KernelBridge",
            "HurtadoZeta23.LimitingKernel",
            "HurtadoZeta23.LocalFunctional",
            "HurtadoZeta23.MatrixEnergy",
            "HurtadoZeta23.OmittedTailReindex",
            "HurtadoZeta23.OnLineSynthesis",
            "HurtadoZeta23.OrderedRetainedColumns",
            "HurtadoZeta23.P4Tail",
            "HurtadoZeta23.PairBandReindex",
            "HurtadoZeta23.PoissonColumnNorm",
            "HurtadoZeta23.PoissonGaborBridge",
            "HurtadoZeta23.PoissonGramUnitBound",
            "HurtadoZeta23.PositionWeights",
            "HurtadoZeta23.PrincipalGramBlocks",
            "HurtadoZeta23.RetainedCardinalityBridge",
            "HurtadoZeta23.RetainedCentralityBridge",
            "HurtadoZeta23.RetainedCoreBridge",
            "HurtadoZeta23.RetainedGramFin",
            "HurtadoZeta23.RetainedGramPinching",
            "HurtadoZeta23.RetainedSpanBridge",
            "HurtadoZeta23.RootMultisetGramBridge",
            "HurtadoZeta23.RvMAsymptotics",
            "HurtadoZeta23.SevenPointCertificateBridge",
            "HurtadoZeta23.ShiftedAveraging",
            "HurtadoZeta23.ShiftedBlockIndexing",
            "HurtadoZeta23.ShiftedPinching",
            "HurtadoZeta23.ShiftedRetainedPinching",
            "HurtadoZeta23.SpanGeometry",
            "HurtadoZeta23.SpectralFrobenius",
            "HurtadoZeta23.StableAssemblySeam",
            "HurtadoZeta23.StableRankTraceMatrix",
            "HurtadoZeta23.StableRankTraceScalar",
            "HurtadoZeta23.StableSeam",
            "HurtadoZeta23.SylvesterGramBridge",
            "HurtadoZeta23.TwoSidedGridTail",
            "HurtadoZeta23.UniformBlockAssembly",
            "HurtadoZeta23.UniformGridTail",
            "HurtadoZeta23.UnshiftedBlockPinching",
            "HurtadoZeta23.WindowCombinatorics",
            "HurtadoZeta23.WindowKernelLimit",
            "HurtadoZeta23.WindowKernelQuantitative",
            "HurtadoZeta23.ZetaRvMBridge",
            "HurtadoZeta23.V17StrongBlockScalar",
            "HurtadoZeta23.V17KernelBridge450",
            "HurtadoZeta23.V17OffDiagonalSplit",
            "HurtadoZeta23.V17PairBands",
            "HurtadoZeta23.V17PoissonTail",
            "HurtadoZeta23.V17AnalyticBridge450",
            "HurtadoZeta23.V17GramEnergy450",
            "HurtadoZeta23.V17AdjacentPair",
            "HurtadoZeta23.V17AdjacentMatching",
            "HurtadoZeta23.V17ConcreteMatching450",
            "HurtadoZeta23.V17MatchingIndices",
            "HurtadoZeta23.V17AdjacentBandScalar",
            "HurtadoZeta23.V17ParitySplit",
            "HurtadoZeta23.V17AdjacentBand450",
            "HurtadoZeta23.V17ScalarPressure",
            "HurtadoZeta23.V17WeightedPressure",
            "HurtadoZeta23.V17SpectralThreshold",
            "HurtadoZeta23.V17FiniteSpectralThreshold",
            "HurtadoZeta23.V17TraceLeSpectralThreshold",
            "HurtadoZeta23.V17GramThreshold450",
            "HurtadoZeta23.V17StrongBlock450"]
          EOF

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd upstream/zeta23
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Fetch mathlib cache
        working-directory: upstream/zeta23
        shell: bash
        run: lake exe cache get

      - name: Build strong block 450
        working-directory: upstream/zeta23
        shell: bash
        run: lake build HurtadoZeta23V17StrongBlock
