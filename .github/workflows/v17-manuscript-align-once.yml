name: Align v17 manuscript once

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - ".github/workflows/v17-manuscript-align-once.yml"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: lean-v17-adaptation
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/align_v17_manuscript.py

      - name: Validate diff
        run: |
          git diff --check
          git diff -- paper/main.tex

      - name: Commit aligned manuscript
        run: |
          git config user.name "Michael Hurtado"
          git config user.email "mhe777@gmail.com"
          git add paper/main.tex
          git commit -m "Align v17 manuscript with formal trust boundary"
          git push origin HEAD:lean-v17-adaptation
