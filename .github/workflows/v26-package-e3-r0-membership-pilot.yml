name: v26 package E3 R0 membership router pilot

on:
  push:
    branches: [v26-package-e-staging]
    paths:
      - 'certification/v26_exact/generate_v26_r0_membership_dispatch.py'
      - '.github/workflows/v26-package-e3-r0-membership-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r0-membership-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Checkout pinned formal-math/zeta23 base
        run: |
          git clone https://github.com/anthropics/formal-math.git /tmp/formal-math
          cd /tmp/formal-math
          git checkout fbdc36bbf17d20af3fd0447c6d1a8a02773c9844
      - name: Reconstruct HurtadoZeta23 source overlay
        run: |
          cd /tmp/formal-math/zeta23
          mkdir -p HurtadoZeta23
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/hurtado-analytic.tar.gz
          tar -xzf /tmp/hurtado-analytic.tar.gz -C .
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado-adj.tar.gz
          tar -xzf /tmp/hurtado-adj.tar.gz -C .
          find "$GITHUB_WORKSPACE"/lean_harness -name '*.lean' -not -path '*/v20_analytic/*' -not -path '*/v21_analytic/*' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "HurtadoZeta23/$(basename "$f")"
          done
          cp "$GITHUB_WORKSPACE"/lean_harness/v20_analytic/*.lean HurtadoZeta23/
          cp "$GITHUB_WORKSPACE"/lean_harness/v21_analytic/*.lean HurtadoZeta23/
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23"
          roots = ["HurtadoZeta23"]
          EOF
      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/formal-math/zeta23/.lake/build
          key: v26-package-e3-r0-membership-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            v26-package-e3-code-dispatch-${{ runner.os }}-
            v26-package-e3-discard03-${{ runner.os }}-
            v26-package-e3-survivors-${{ runner.os }}-
            v26-package-e3-zeta23-${{ runner.os }}-
            v26-package-e-zeta23-${{ runner.os }}-
      - name: Generate R0 membership inputs
        run: |
          OUT=/tmp/formal-math/zeta23/HurtadoZeta23
          python certification/v26_exact/generate_v26_bootstrap_lean.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r0_cell_catalog.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r0_analytic_discards.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r0_membership_dispatch.py --out-dir "$OUT"
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('/tmp/formal-math/zeta23/HurtadoZeta23/v26_r0_membership_dispatch_manifest.json').read_text())
          assert m['package_d_codes'] == 511
          assert m['discard_codes'] == 280
          assert m['survivor_codes'] == 231
          assert m['discard_chunks'] == 28
          print('R0 membership manifest counts OK')
          PY
          if grep -R -n -E '\b(sorry|admit|axiom|opaque|unsafe|native_decide)\b' \
              "$OUT"/V26R0MembershipDispatch*Generated.lean; then
            echo 'Forbidden proof shortcut found in R0 membership router'
            exit 1
          fi
      - name: Fetch mathlib cache
        run: |
          cd /tmp/formal-math/zeta23
          lake exe cache get
      - name: Kernel-check R0 membership base
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26R0MembershipDispatchBaseGenerated
      - name: Kernel-check first R0 membership discard chunk
        run: |
          cd /tmp/formal-math/zeta23
          set +e
          lake build HurtadoZeta23.V26R0MembershipDispatchDiscard00Generated > "$GITHUB_WORKSPACE/r0-membership.log" 2>&1
          status=$?
          grep -n -E 'error:|unsolved goals|type mismatch|application type mismatch|failed to synthesize|unknown identifier|maximum heartbeats|maximum recursion' "$GITHUB_WORKSPACE/r0-membership.log" | tail -n 80 || true
          tail -n 140 "$GITHUB_WORKSPACE/r0-membership.log"
          exit "$status"
      - name: Upload R0 membership diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-membership-diagnostic
          path: r0-membership.log
          if-no-files-found: warn
      - name: Save Lean build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/formal-math/zeta23/.lake/build
          key: v26-package-e3-r0-membership-${{ runner.os }}-${{ github.sha }}
