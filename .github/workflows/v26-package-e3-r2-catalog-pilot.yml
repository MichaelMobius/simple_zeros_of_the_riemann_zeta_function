name: v26 package E3 R2 cell catalog pilot

on:
  push:
    branches: [v26-package-e-staging]
    paths:
      - 'certification/v26_exact/generate_v26_r2_cell_catalog.py'
      - '.github/workflows/v26-package-e3-r2-catalog-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-catalog-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned formal-math/zeta23 base
        run: |
          git clone https://github.com/anthropics/formal-math.git /tmp/formal-math
          cd /tmp/formal-math
          git checkout fbdc36bbf17d20af3fd0447c6d1a8a02773c9844

      - name: Reconstruct HurtadoZeta23 source overlay
        run: |
          cd /tmp/formal-math/zeta23
          mkdir -p HurtadoZeta23
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/hurtado-analytic.tar.gz
          tar -xzf /tmp/hurtado-analytic.tar.gz -C .
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado-adj.tar.gz
          tar -xzf /tmp/hurtado-adj.tar.gz -C .
          find "$GITHUB_WORKSPACE"/lean_harness -name '*.lean' -not -path '*/v20_analytic/*' -not -path '*/v21_analytic/*' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "HurtadoZeta23/$(basename "$f")"
          done
          cp "$GITHUB_WORKSPACE"/lean_harness/v20_analytic/*.lean HurtadoZeta23/
          cp "$GITHUB_WORKSPACE"/lean_harness/v21_analytic/*.lean HurtadoZeta23/
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23"
          roots = ["HurtadoZeta23"]
          EOF

      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/formal-math/zeta23/.lake/build
          key: v26-package-e3-r2-catalog-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            v26-package-e3-r1-membership-${{ runner.os }}-
            v26-package-e3-r1-survivor-${{ runner.os }}-
            v26-package-e3-r1-catalog-${{ runner.os }}-
            v26-package-e3-zeta23-${{ runner.os }}-
            v26-package-e-zeta23-${{ runner.os }}-

      - name: Generate R2 analytic cell catalog
        run: |
          OUT=/tmp/formal-math/zeta23/HurtadoZeta23
          python certification/v26_exact/generate_v26_r2_cell_catalog.py --out-dir "$OUT"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/formal-math/zeta23/HurtadoZeta23/v26_r2_cell_catalog_manifest.json')
          m = json.loads(p.read_text())
          assert m['round2_input_words'] == 23
          assert m['round3_survivors'] == 5
          assert m['round2_discards'] == 18
          assert 0 < m['distinct_cells'] <= m['historical_uses'] <= 23 * 21
          assert len(m['modules']) > 0
          print('R2 catalog manifest:', m['distinct_cells'], 'cells,', m['historical_uses'], 'uses,', len(m['modules']), 'modules')
          print('R2_LAST_MODULE=' + m['modules'][-1])
          PY
          if grep -R -n -E '\b(sorry|admit|axiom|opaque|unsafe|native_decide)\b' \
              "$OUT"/V26R2CellCatalog*Generated.lean; then
            echo 'Forbidden proof shortcut found in R2 catalog'
            exit 1
          fi

      - name: Fetch mathlib cache
        run: |
          cd /tmp/formal-math/zeta23
          lake exe cache get

      - name: Kernel-check first and last R2 catalog chunks
        run: |
          cd /tmp/formal-math/zeta23
          last=$(python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('HurtadoZeta23/v26_r2_cell_catalog_manifest.json').read_text())
          print(m['modules'][-1])
          PY
          )
          lake build HurtadoZeta23.V26R2CellCatalog000Generated "HurtadoZeta23.${last}"

      - name: Upload R2 catalog manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-cell-catalog-manifest
          path: /tmp/formal-math/zeta23/HurtadoZeta23/v26_r2_cell_catalog_manifest.json
          if-no-files-found: warn

      - name: Save Lean build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/formal-math/zeta23/.lake/build
          key: v26-package-e3-r2-catalog-${{ runner.os }}-${{ github.sha }}
