name: Inspect v17 packed sources

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - ".github/workflows/v17-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
      - name: Extract packed Hurtado sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/zeta
          cat lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C /tmp/zeta
      - name: Locate threshold dependency sources
        shell: bash
        run: |
          set -euo pipefail
          echo '===== TARGET PATHS ====='
          find /tmp/zeta -type f \( -name 'UniformBlockAssembly.lean' -o -name 'PoissonGaborBridge.lean' \) -print
          echo '===== TOP-LEVEL HURTADO LISTING ====='
          find /tmp/zeta/HurtadoZeta23 -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | grep -E 'UniformBlockAssembly|PoissonGaborBridge|ConsecutiveBlockStabilityBridge' || true
          echo '===== ARCHIVE MATCHES ====='
          tar -tzf /tmp/hurtado.tar.gz | grep -E 'UniformBlockAssembly|PoissonGaborBridge|ConsecutiveBlockStabilityBridge' || true
