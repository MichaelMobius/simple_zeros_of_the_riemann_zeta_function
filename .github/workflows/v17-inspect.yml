name: Inspect v17 packed sources

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - ".github/workflows/v17-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
      - name: Extract packed Hurtado sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/zeta
          cat lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C /tmp/zeta
      - name: Show definitions needed for v17-450
        shell: bash
        run: |
          set -euo pipefail
          echo '===== pairBandEnergy / globalPairEnergyNat ====='
          grep -R -n -C 12 -E 'def pairBandEnergy|def globalPairEnergyNat|theorem shifted_pair_sum_le_band' /tmp/zeta/HurtadoZeta23 || true
          echo '===== block length / principal blocks ====='
          grep -R -n -C 10 -E 'blockLength|principalGramBlock|consecutive.*Block|blockGram' /tmp/zeta/HurtadoZeta23 || true
          echo '===== diagonal / column norm facts ====='
          grep -R -n -C 10 -E 'diag.*le|diagonal.*le|column.*norm|norm.*column|gram.*diag' /tmp/zeta/HurtadoZeta23 || true
          echo '===== Poisson overlap approximation ====='
          grep -R -n -C 10 -E 'RawPointwiseOverlapApproximation262|pointwiseKernelApproximation262|overlap' /tmp/zeta/HurtadoZeta23/PoissonGaborBridge.lean || true
