name: Inspect v17 packed sources

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - ".github/workflows/v17-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
      - name: Extract packed Hurtado sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/zeta
          cat lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C /tmp/zeta
      - name: Inspect exact v17 interfaces
        shell: bash
        run: |
          set -euo pipefail
          echo '===== ORDERED RETAINED Y ====='
          grep -R -n -C 12 -E 'orderedRetainedY|orderedRetainedZero.*mono|orderedRetained.*mono|strictMono.*Retained|Monotone.*Retained' /tmp/zeta/HurtadoZeta23 || true
          echo '===== SEVEN POINT CERTIFICATE ====='
          grep -R -n -C 12 -E 'SevenPointCertificate|sevenPoint|seven_point|certificate.*limiting|limiting.*certificate' /tmp/zeta/HurtadoZeta23 || true
          echo '===== SHIFTED AVERAGING INTERFACES ====='
          grep -R -n -C 10 -E 'ShiftedAveraging|shifted.*average|average.*shifted|consecutive.*block|block.*average' /tmp/zeta/HurtadoZeta23/Shifted*.lean /tmp/zeta/HurtadoZeta23/GlobalAssembly.lean 2>/dev/null || true
