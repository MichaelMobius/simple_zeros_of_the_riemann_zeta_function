name: Inspect v17 packed sources

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - ".github/workflows/v17-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
      - name: Extract packed Hurtado sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/zeta
          cat lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C /tmp/zeta
      - name: Search analytic overlap and kernel interfaces
        shell: bash
        run: |
          set -euo pipefail
          echo '===== ANALYTIC OVERLAP / KERNEL OCCURRENCES ====='
          grep -R -n -C 28 -E 'overlap|Overlap|kernel|Kernel|uniform|Uniform|compact|Compact|PoissonSq|simpleOnLineSynthesis|Gram.*approx|approx.*Gram|raw.*point|point.*raw' /tmp/zeta/HurtadoZeta23 | head -n 3200 || true
          echo '===== RELEVANT FILE HEADERS ====='
          for f in /tmp/zeta/HurtadoZeta23/*Kernel*.lean /tmp/zeta/HurtadoZeta23/*Poisson*.lean /tmp/zeta/HurtadoZeta23/OnLineSynthesis.lean /tmp/zeta/HurtadoZeta23/PrincipalGramBlocks.lean; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              sed -n '1,260p' "$f"
            fi
          done
