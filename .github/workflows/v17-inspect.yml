name: Inspect v17 packed sources

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - ".github/workflows/v17-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
      - name: Extract packed Hurtado sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/zeta
          cat lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C /tmp/zeta
      - name: Search retained block geometry
        shell: bash
        run: |
          set -euo pipefail
          echo '===== CENTRAL / RETAINED / BOUNDARY GEOMETRY ====='
          grep -R -n -C 35 -E 'retained|Retained|central|Central|boundary|Boundary|D0|D₀|trim|Trim|interior|Interior|M.?circ|I.?circ' /tmp/zeta/HurtadoZeta23 | head -n 3600 || true
          echo '===== SHIFTED MODULES ====='
          for f in /tmp/zeta/HurtadoZeta23/Shifted*.lean /tmp/zeta/HurtadoZeta23/GlobalAssembly.lean; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              cat "$f"
            fi
          done
