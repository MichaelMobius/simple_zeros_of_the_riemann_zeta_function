name: Inspect v17 packed sources

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - ".github/workflows/v17-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
      - name: Extract packed Hurtado sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/zeta
          cat lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C /tmp/zeta
      - name: Inspect exact source modules
        shell: bash
        run: |
          set -euo pipefail
          for f in OrderedRetainedColumns.lean SevenPointCertificateBridge.lean ShiftedAveraging.lean ShiftedPinching.lean GlobalAssembly.lean UniformBlockAssembly.lean; do
            p="/tmp/zeta/HurtadoZeta23/$f"
            if [ -f "$p" ]; then
              echo "===== $f ====="
              cat "$p"
            else
              echo "===== MISSING $f ====="
            fi
          done
