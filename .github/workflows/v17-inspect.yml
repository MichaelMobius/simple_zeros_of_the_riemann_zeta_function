name: Inspect v17 packed sources

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - ".github/workflows/v17-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
      - name: Extract packed Hurtado sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/zeta
          cat lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C /tmp/zeta
      - name: Show exact v17-450 interfaces
        shell: bash
        run: |
          set -euo pipefail
          echo '===== PACKED FILES ====='
          find /tmp/zeta/HurtadoZeta23 -maxdepth 1 -type f -printf '%f\n' | sort
          echo '===== RAW OVERLAP APPROXIMATION ====='
          grep -R -n -C 18 -E 'RawPointwiseOverlapApproximation262|pointwiseKernelApproximation262_of_raw|pointwiseKernelApproximation262' /tmp/zeta/HurtadoZeta23 || true
          echo '===== OVERLAP / KERNEL BRIDGE DEFINITIONS ====='
          grep -R -n -C 12 -E 'limitingWeightOnPoints|RawPointwise|KernelApproximation|overlapApprox|overlap' /tmp/zeta/HurtadoZeta23 | head -n 600 || true
          echo '===== POINTWISE DIAGONAL / SYNTHESIS COLUMNS ====='
          grep -R -n -C 16 -E 'simpleSynthesis|SimpleOnLineColumn|restrictSynthesis|column.*norm|norm.*column|diag.*one|diag.*le|diagonal|conjTranspose.*mul' /tmp/zeta/HurtadoZeta23/OnLineSynthesis.lean /tmp/zeta/HurtadoZeta23/PrincipalGramBlocks.lean /tmp/zeta/HurtadoZeta23/ConcreteBlockDefect.lean 2>/dev/null | head -n 800 || true
          echo '===== SHIFTED PAIR INJECTION ====='
          grep -R -n -C 18 -E 'shifted_pair_sum_le_band|summed_localPairEnergy_le_global|sum_shifted_range_le_range' /tmp/zeta/HurtadoZeta23/DirectRedistribution.lean || true
