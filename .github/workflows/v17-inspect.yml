name: Inspect v17 packed sources

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - ".github/workflows/v17-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
      - name: Extract packed Hurtado sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/zeta
          cat lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C /tmp/zeta
      - name: Search global pair-energy combinatorics
        shell: bash
        run: |
          set -euo pipefail
          echo '===== GLOBAL PAIR ENERGY OCCURRENCES ====='
          grep -R -n -C 24 -E 'globalPairEnergyNat|pairBandEnergy|upper.*tri|strict.*upper|all.*pairs|unordered.*pairs' /tmp/zeta/HurtadoZeta23 | head -n 2200 || true
