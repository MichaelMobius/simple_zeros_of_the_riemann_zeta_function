name: Inspect v17 final closure

on:
  push:
    branches: [lean-v17-adaptation]
    paths:
      - ".github/workflows/v17-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Reconstruct current Hurtado source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zeta
          cat lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado.tar.gz
          tar -xzf /tmp/hurtado.tar.gz -C /tmp/zeta
          cat lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/hurtado-analytic.tar.gz
          tar -xzf /tmp/hurtado-analytic.tar.gz -C /tmp/zeta
          mkdir -p /tmp/zeta/HurtadoZeta23
          for d in frozen v17_scalar v17_weighted v17_adj v17_matching v17_threshold v17_energy v17_strong v17_concrete v17_endgame v17_global; do
            if compgen -G "lean_harness/$d/*.lean" > /dev/null; then
              cp lean_harness/$d/*.lean /tmp/zeta/HurtadoZeta23/
            fi
          done

      - name: Compute exact final import closure
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/zeta
          python3 - <<'PY'
          from pathlib import Path
          todo = ['HurtadoZeta23.V17FinalAssembly']
          seen = set()
          missing = []
          while todo:
              mod = todo.pop()
              if mod in seen:
                  continue
              seen.add(mod)
              path = Path(mod.replace('.', '/') + '.lean')
              if not path.exists():
                  missing.append((mod, '<root>'))
                  continue
              for line in path.read_text(encoding='utf-8').splitlines():
                  s = line.strip()
                  if not s.startswith('import '):
                      continue
                  for dep in s[len('import '):].split():
                      if dep.startswith('HurtadoZeta23.'):
                          dpath = Path(dep.replace('.', '/') + '.lean')
                          if dpath.exists():
                              todo.append(dep)
                          else:
                              missing.append((dep, mod))
          if missing:
              print('MISSING_IMPORTS')
              for dep, parent in missing:
                  print(parent, '->', dep)
              raise SystemExit(1)
          paths = sorted(Path(m.replace('.', '/') + '.lean') for m in seen)
          Path('/tmp/v17-closure.txt').write_text('\n'.join(str(p) for p in paths) + '\n')
          print('FINAL_CLOSURE_MODULES', len(paths))
          for p in paths:
              print(p)
          PY

      - name: Audit proof escape hatches
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/zeta
          python3 - <<'PY'
          from pathlib import Path
          import re

          def strip_lean_comments(src: str) -> str:
              out = []
              i = 0
              depth = 0
              n = len(src)
              while i < n:
                  if src.startswith('/-', i):
                      depth += 1
                      i += 2
                  elif depth > 0 and src.startswith('-/', i):
                      depth -= 1
                      i += 2
                  elif depth > 0:
                      if src[i] == '\n':
                          out.append('\n')
                      i += 1
                  elif src.startswith('--', i):
                      j = src.find('\n', i)
                      if j == -1:
                          break
                      out.append('\n')
                      i = j + 1
                  else:
                      out.append(src[i])
                      i += 1
              return ''.join(out)

          checks = [
              ('axiom declaration', re.compile(r'(?m)^\s*axiom\s+')),
              ('sorry', re.compile(r'\bsorry\b')),
              ('admit', re.compile(r'\badmit\b')),
              ('unsafe declaration', re.compile(r'(?m)^\s*unsafe\s+(?:def|theorem|opaque|axiom)\b')),
          ]
          bad = []
          files = [Path(x) for x in Path('/tmp/v17-closure.txt').read_text().splitlines() if x]
          for f in files:
              src = strip_lean_comments(f.read_text(encoding='utf-8'))
              for label, pat in checks:
                  for m in pat.finditer(src):
                      line = src.count('\n', 0, m.start()) + 1
                      snippet = src.splitlines()[line - 1].strip()
                      bad.append((str(f), line, label, snippet))
          if bad:
              print('PROOF_ESCAPE_HATCH_FOUND')
              for f, line, label, snippet in bad:
                  print(f'{f}:{line}: {label}: {snippet}')
              raise SystemExit(1)
          print('NO_PROOF_ESCAPE_HATCHES')
          PY

      - name: Audit explicit trust propositions and final signature
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/zeta
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path(x) for x in Path('/tmp/v17-closure.txt').read_text().splitlines() if x]
          print('===== PROP CLAIM DEFINITIONS IN FINAL CLOSURE =====')
          claim_pat = re.compile(r'(?m)^\s*(?:noncomputable\s+)?def\s+([A-Za-z0-9_\.]*Claim)\s*:\s*Prop\s*:=')
          for f in files:
              src = f.read_text(encoding='utf-8')
              for m in claim_pat.finditer(src):
                  print(f'{f}: {m.group(1)}')

          final = Path('HurtadoZeta23/V17FinalAssembly.lean').read_text(encoding='utf-8')
          print('===== FINAL CERTIFICATE WRAPPER SIGNATURE =====')
          for name in ['v17GlobalRefinement_of_certificates', 'v17_published_eps_form_of_certificates']:
              pos = final.find(name)
              if pos < 0:
                  print('MISSING', name)
                  raise SystemExit(1)
              start = final.rfind('\n', 0, pos) + 1
              end = final.find(':=', pos)
              if end < 0:
                  end = final.find(':= by', pos)
              print(final[start:end + 2].strip())

          expected = [
              '(hcertExt : ArchivedSevenPointClaim)',
              '(hsigned : V17KernelSignedCertPointClaim)'
          ]
          sig_start = final.find('theorem v17_published_eps_form_of_certificates')
          sig_end = final.find(':= by', sig_start)
          sig = final[sig_start:sig_end]
          for token in expected:
              if token not in sig:
                  print('FINAL_SIGNATURE_MISSING', token)
                  raise SystemExit(1)
          if '(hscalarExt : V17ScalarPressureClaim)' in sig:
              print('ABSTRACT_SCALAR_FRONTIER_LEAKED_INTO_FINAL_SIGNATURE')
              raise SystemExit(1)
          print('FINAL_SIGNATURE_TRUST_FRONTIER_OK')
          PY
