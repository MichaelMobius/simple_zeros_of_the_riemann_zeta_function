name: V20 retarget CI to browseable Lean sources

on:
  push:
    branches:
      - v20-public-auditability
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retarget CI and remove encoded source transport
        shell: bash
        run: bash .github/v20_retarget_wrapper.sh
