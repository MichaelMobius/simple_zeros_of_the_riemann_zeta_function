name: V20 materialize Lean sources

on:
  push:
    branches:
      - v20-public-auditability
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize browseable sources
        shell: bash
        run: bash .github/v20_materialize.sh
