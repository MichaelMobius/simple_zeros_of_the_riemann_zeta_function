name: Assemble corrected formal paper draft

on:
  push:
    branches:
      - v2.0.0-formal-prep
    paths:
      - staging-paper/READY
  pull_request:
    branches:
      - v2.0.0-formal-prep
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preparation branch
        uses: actions/checkout@v4
        with:
          ref: v2.0.0-formal-prep
          fetch-depth: 0

      - name: Reassemble exact corrected TeX source
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, lzma

          stage = Path('staging-paper')
          parts = sorted(stage.glob('main.tex.xz.b64.part*'))
          if not parts:
              raise SystemExit('No TeX source parts found')

          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          compressed = base64.b64decode(encoded, validate=True)
          data = lzma.decompress(compressed)
          expected = '1e92e47336042cbf35cb428f009705ec6ceeadbe52370125fe85e65ccc8258bd'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'TeX SHA-256 mismatch: {actual} != {expected}')

          out = Path('paper/main.tex')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)
          print('paper/main.tex', len(data), actual)

      - name: Install LaTeX toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils

      - name: Compile corrected draft PDF
        shell: bash
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=paper paper/main.tex
          test -s paper/main.pdf
          pdfinfo paper/main.pdf | sed -n '1,20p'

      - name: Commit corrected TeX and PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.tex paper/main.pdf
          git rm -r staging-paper
          git commit -m "Add corrected v17 formal paper draft (TeX and PDF)"
          git push origin HEAD:v2.0.0-formal-prep
