name: v26 package E3 R2 analytic closure

on:
  push:
    branches: [v26-package-e-staging]
    paths:
      - 'certification/v26_exact/generate_v26_r2_cell_catalog.py'
      - 'certification/v26_exact/generate_v26_r2_analytic_discards.py'
      - 'certification/v26_exact/generate_v26_r2_survivor_contractions.py'
      - '.github/workflows/v26-package-e3-r2-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-analytic-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned formal-math/zeta23 base
        run: |
          git clone https://github.com/anthropics/formal-math.git /tmp/formal-math
          cd /tmp/formal-math
          git checkout fbdc36bbf17d20af3fd0447c6d1a8a02773c9844

      - name: Reconstruct HurtadoZeta23 source overlay
        run: |
          cd /tmp/formal-math/zeta23
          mkdir -p HurtadoZeta23
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/hurtado-analytic.tar.gz
          tar -xzf /tmp/hurtado-analytic.tar.gz -C .
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado-adj.tar.gz
          tar -xzf /tmp/hurtado-adj.tar.gz -C .
          find "$GITHUB_WORKSPACE"/lean_harness -name '*.lean' -not -path '*/v20_analytic/*' -not -path '*/v21_analytic/*' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "HurtadoZeta23/$(basename "$f")"
          done
          cp "$GITHUB_WORKSPACE"/lean_harness/v20_analytic/*.lean HurtadoZeta23/
          cp "$GITHUB_WORKSPACE"/lean_harness/v21_analytic/*.lean HurtadoZeta23/
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23"
          roots = ["HurtadoZeta23"]
          EOF

      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/formal-math/zeta23/.lake/build
          key: v26-package-e3-r2-closure-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            v26-package-e3-r2-catalog-${{ runner.os }}-
            v26-package-e3-r1-membership-${{ runner.os }}-
            v26-package-e3-r1-survivor-${{ runner.os }}-
            v26-package-e3-r1-catalog-${{ runner.os }}-
            v26-package-e3-zeta23-${{ runner.os }}-
            v26-package-e-zeta23-${{ runner.os }}-

      - name: Generate R0/R1 prerequisites and R2 closure certificates
        run: |
          OUT=/tmp/formal-math/zeta23/HurtadoZeta23
          python certification/v26_exact/generate_v26_bootstrap_lean.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r0_cell_catalog.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r0_survivor_contractions.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r1_cell_catalog.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r1_survivor_contractions.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r2_cell_catalog.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r2_analytic_discards.py --out-dir "$OUT"
          python certification/v26_exact/generate_v26_r2_survivor_contractions.py --out-dir "$OUT"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/formal-math/zeta23/HurtadoZeta23')
          c = json.loads((root / 'v26_r2_cell_catalog_manifest.json').read_text())
          d = json.loads((root / 'v26_r2_analytic_discards_manifest.json').read_text())
          s = json.loads((root / 'v26_r2_survivor_contractions_manifest.json').read_text())
          assert c['round2_input_words'] == 23
          assert c['round2_discards'] == 18
          assert c['round3_survivors'] == 5
          assert d['discard_count'] == 18 and len(d['modules']) == 2
          assert s['survivor_count'] == 5
          assert s['codes'] == ['121212', '121221', '122121', '212121', '212212']
          print('R2 exact manifests OK')
          PY
          if grep -R -n -E '\b(sorry|admit|axiom|opaque|unsafe|native_decide)\b' \
              "$OUT"/V26R2*Generated.lean; then
            echo 'Forbidden proof shortcut found in R2 generated certificates'
            exit 1
          fi

      - name: Fetch mathlib cache
        run: |
          cd /tmp/formal-math/zeta23
          lake exe cache get

      - name: Kernel-check all 18 R2 analytic discard bridges
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26R2AnalyticDiscardsGenerated

      - name: Kernel-check all five R2 survivor contractions
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26R2SurvivorContractionsGenerated

      - name: Upload R2 manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-closure-manifests
          path: |
            /tmp/formal-math/zeta23/HurtadoZeta23/v26_r2_cell_catalog_manifest.json
            /tmp/formal-math/zeta23/HurtadoZeta23/v26_r2_analytic_discards_manifest.json
            /tmp/formal-math/zeta23/HurtadoZeta23/v26_r2_survivor_contractions_manifest.json
          if-no-files-found: warn

      - name: Save Lean build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/formal-math/zeta23/.lake/build
          key: v26-package-e3-r2-closure-${{ runner.os }}-${{ github.sha }}
