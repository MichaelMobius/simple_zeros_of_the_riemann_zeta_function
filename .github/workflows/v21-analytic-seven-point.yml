name: v21 analytic seven-point

on:
  push:
    branches: [v21-analytic-seven-point, v26-lean-verification]
  workflow_dispatch:

concurrency:
  group: v21-analytic-seven-point-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analytic-seven-point:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned formal-math/zeta23 base
        run: |
          git clone https://github.com/anthropics/formal-math.git /tmp/formal-math
          cd /tmp/formal-math
          git checkout fbdc36bbf17d20af3fd0447c6d1a8a02773c9844

      - name: Reconstruct HurtadoZeta23 source overlay
        run: |
          cd /tmp/formal-math/zeta23
          mkdir -p HurtadoZeta23
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_analytic/part*.b64 | base64 -d > /tmp/hurtado-analytic.tar.gz
          tar -xzf /tmp/hurtado-analytic.tar.gz -C .
          cat "$GITHUB_WORKSPACE"/lean_harness/v17_adj/part*.b64 | base64 -d > /tmp/hurtado-adj.tar.gz
          tar -xzf /tmp/hurtado-adj.tar.gz -C .
          find "$GITHUB_WORKSPACE"/lean_harness -name '*.lean' -not -path '*/v20_analytic/*' -not -path '*/v21_analytic/*' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "HurtadoZeta23/$(basename "$f")"
          done
          cp "$GITHUB_WORKSPACE"/lean_harness/v20_analytic/*.lean HurtadoZeta23/
          if compgen -G "$GITHUB_WORKSPACE/lean_harness/v21_analytic/*.lean" > /dev/null; then
            cp "$GITHUB_WORKSPACE"/lean_harness/v21_analytic/*.lean HurtadoZeta23/
          fi
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "HurtadoZeta23"
          roots = ["HurtadoZeta23"]
          EOF

      - name: Reject forbidden proof shortcuts in v26 modules
        run: |
          if grep -R -n -E '\b(sorry|admit|axiom|opaque|unsafe|native_decide)\b' lean_harness/v21_analytic/V26*.lean; then
            echo 'Forbidden proof shortcut found in V26 module'
            exit 1
          fi

      - name: Fetch mathlib cache
        run: |
          cd /tmp/formal-math/zeta23
          lake exe cache get

      - name: Build historical v20 closure
        if: github.ref_name == 'v21-analytic-seven-point'
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V20FinalAssembly

      - name: Build historical v21 target
        if: github.ref_name == 'v21-analytic-seven-point'
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V21SevenPointAnalytic
          if [ -f HurtadoZeta23/V21FinalAssembly.lean ]; then
            lake build HurtadoZeta23.V21FinalAssembly
          fi

      - name: Verify v26 44100-to-511 certificate
        if: github.ref_name == 'v26-lean-verification'
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26Word511Certificate

      - name: Verify v26 bootstrap stage bookkeeping
        if: github.ref_name == 'v26-lean-verification'
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26BootstrapStageLists

      - name: Verify v26 one-body bridge
        if: github.ref_name == 'v26-lean-verification'
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26WordBridge

      - name: Verify v26 rational quadratic core
        if: github.ref_name == 'v26-lean-verification'
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26QuadraticCore

      - name: Verify first exact R0 discard
        if: github.ref_name == 'v26-lean-verification'
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26Round0Prototype

      - name: Verify v26 basin interface
        if: github.ref_name == 'v26-lean-verification'
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26BasinInterface

      - name: Verify v26 Taylor extension
        if: github.ref_name == 'v26-lean-verification'
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26TaylorExtension

      - name: Verify v26 rational root center
        if: github.ref_name == 'v26-lean-verification'
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26RationalCenter

      - name: Verify v26 phase distance geometry
        if: github.ref_name == 'v26-lean-verification'
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26PhaseGeometry

      - name: Verify v26 upper phase distortion
        if: github.ref_name == 'v26-lean-verification'
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26PhaseUpper

      - name: Verify v26 phase constants
        if: github.ref_name == 'v26-lean-verification'
        run: |
          cd /tmp/formal-math/zeta23
          lake build HurtadoZeta23.V26PhaseConstants
